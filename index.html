 steps:["Compute the sample mean.","Compute the sample variance (with n-1 denominator).","Compute the sample covariance for pairs.","Check the correlation = cov / (sd_x * sd_y)."],
 pseudo:"Sample mean:\n  x_bar = (1/n) sum x_i\n\nSample variance:\n  s^2 = (1/(n-1)) sum (x_i - x_bar)^2\n\nSample covariance:\n  cov_xy = (1/(n-1)) sum (x_i - x_bar)(y_i - y_bar)\n\nCorrelation:\n  r = cov_xy / (s_x s_y), in [-1, 1]\n\nProperties:\n  E[aX + b] = a E[X] + b\n  Var(aX + b) = a^2 Var(X)\n  Var(X + Y) = Var(X) + Var(Y) + 2 Cov(X, Y)\n  If X, Y independent: Var(X + Y) = Var(X) + Var(Y)",
 invariant:"Variance is non-negative. The n-1 denominator makes the sample variance unbiased for the population variance.",
 uses:"Descriptive statistics, risk, portfolio theory, experimental design.",
 strength:"Simple, universal. Foundation of all statistical inference.",
 limits:"Sensitive to outliers. Not robust. Requires finite second moments.",
 pitfall:"Using n instead of n-1 gives a biased variance. Only use n for the population variance.",
 question:"If X and Y are independent with Var(X)=4 and Var(Y)=9, what is Var(X - Y)?",
 answer:"13. Var(X - Y) = Var(X) + Var(Y) - 2 Cov(X, Y) = 4 + 9 - 0 = 13.",
 demo:"expectation-variance",sample:"2, 4, 4, 4, 5, 5, 7, 9",refs:[
  ["Casella and Berger, Statistical Inference, Chapter 2-4","https://www.cengage.com/c/statistical-inference-2e-casella/9780534243128/"],
  ["Wasserman, All of Statistics, Springer 2004","https://link.springer.com/book/10.1007/978-0-387-21736-9"],
  ["Freedman, Pisani, Purves, Statistics, 4th ed., Norton 2007","https://wwnorton.com/books/9780393929720"]]},
{id:"bayes",title:"Bayes' theorem and conditional probability",level:3,kind:"Foundation",status:"Runnable teaching lab",
 summary:"Bayes' theorem updates a prior probability with evidence to give a posterior. It is the correct way to reason about uncertainty and the base-rate fallacy.",
 mental:"Prior times likelihood, normalized by the evidence",
 mentalText:"P(A|B) = P(B|A) P(A) / P(B). The posterior is proportional to the prior times the likelihood.",
 steps:["Identify the prior P(A).","Identify the likelihood P(B|A).","Compute the evidence P(B) = sum P(B|A_i) P(A_i).","Compute the posterior P(A|B)."],
 pseudo:"Bayes' theorem:\n  P(A | B) = P(B | A) P(A) / P(B)\n\nExpanded:\n  P(A | B) = P(B | A) P(A) / [P(B|A) P(A) + P(B|~A) P(~A)]\n\nMedical test example:\n  prior: P(disease) = 0.01\n  sensitivity: P(test+ | disease) = 0.90\n  specificity: P(test- | no disease) = 0.95\n  P(test+) = 0.90*0.01 + 0.05*0.99 = 0.0585\n  P(disease | test+) = 0.90*0.01 / 0.0585 = 0.1538\n\nSo even after a positive test, only ~15% chance of disease.\nThis is the base-rate fallacy.",
 invariant:"The prior must be a genuine probability distribution. Garbage prior, garbage posterior.",
 uses:"Diagnosis, spam filtering, spam classification, Bayesian inference, A/B testing.",
 strength:"Correct reasoning about uncertainty. Combines prior knowledge and evidence.",
 limits:"Requires a prior. Sensitive to prior choice when data is scarce.",
 pitfall:"Ignoring the base rate. A positive test for a rare disease is often a false positive.",
 question:"If 1 in 10,000 people have a disease, a test has 99% sensitivity and 99% specificity, what is P(disease | positive)?",
 answer:"Approximately 1%. The base rate is so low that most positives are false positives.",
 demo:"bayes",sample:"0.01 0.90 0.95",refs:[
  ["Bayes, An Essay towards Solving a Problem in the Doctrine of Chances, 1763","https://doi.org/10.1098/rstl.1763.0053"],
  ["Kahneman and Tversky, On the psychology of prediction, Psychological Review 1973","https://doi.org/10.1037/h0034747"],
  ["Gelman et al., Bayesian Data Analysis, 3rd ed., CRC 2013","https://www.routledge.com/Bayesian-Data-Analysis/Gelman-Carlin-Stern-Dunson-Vehtari-Rubin/p/book/9781439840955"]]},
/* ================= 26.2 Descriptive and resampling ================= */
{id:"descriptive-robust",title:"Descriptive statistics and robust summaries",level:2,kind:"Descriptive",status:"Runnable teaching lab",
 summary:"The mean and standard deviation are sensitive to outliers. The median, IQR, MAD and trimmed mean are robust alternatives with a high breakdown point.",
 mental:"Summaries that survive a few extreme values",
 mentalText:"The median is the middle value. The IQR is the middle 50%. The MAD is the median absolute deviation from the median. These do not blow up when a few points are extreme.",
 steps:["Compute the median and quantiles.","Compute the IQR = Q3 - Q1.","Compute the MAD = median(|x - median|).","Optionally compute a trimmed mean (drop top/bottom 5%)."],
 pseudo:"Quantile (linear interpolation):\n  sort x\n  h = (n - 1) * p\n  lo = floor(h), hi = ceil(h)\n  q = x[lo] + (h - lo) * (x[hi] - x[lo])\n\nIQR = Q3 - Q1\n\nMAD = median(|x_i - median(x)|)\n\nRobust z-score = (x - median) / (1.4826 * MAD)\n  1.4826 makes it consistent with the Normal sigma\n\nBreakdown point:\n  mean, sd: 0%\n  median, IQR, MAD: 50%",
 invariant:"The median and IQR have a 50% breakdown point. They remain informative even if half the data is contaminated.",
 uses:"Exploratory data analysis, quality control, robust statistics, outlier detection.",
 strength:"Robust. Resistant to outliers and heavy tails.",
 limits:"Less efficient than the mean under Normality. Harder to extend to multivariate settings.",
 pitfall:"Reporting the mean and sd when the data is skewed gives a misleading summary. Always look at a histogram or boxplot.",
 question:"What is the breakdown point of the median?",
 answer:"50%. You can corrupt up to half the data without moving the median arbitrarily.",
 demo:"descriptive",sample:"2, 4, 4, 4, 5, 5, 7, 9, 100",refs:[
  ["Tukey, Exploratory Data Analysis, Addison-Wesley 1977","https://www.pearson.com/en-us/subject-catalog/p/exploratory-data-analysis/P200000003409"],
  ["Huber and Ronchetti, Robust Statistics, 2nd ed., Wiley 2009","https://www.wiley.com/en-us/Robust+Statistics%2C+2nd+Edition-p-9780470129906"],
  ["Rousseeuw and Leroy, Robust Regression and Outlier Detection, Wiley 1987","https://www.wiley.com/en-us/Robust+Regression+and+Outlier+Detection-p-9780471852339"]]},
{id:"bootstrap-permutation",title:"Bootstrap, permutation tests and confidence intervals",level:4,kind:"Resampling",status:"Runnable teaching lab",
 summary:"The bootstrap estimates the sampling distribution by resampling with replacement. Permutation tests estimate the null distribution by shuffling labels. Both avoid parametric assumptions.",
 mental:"Resample the data to see how the estimate varies",
 mentalText:"The bootstrap treats the sample as a stand-in for the population. Draw many resamples with replacement, recompute the statistic, and use the spread as the sampling distribution.",
 steps:["Compute the statistic on the original sample.","Bootstrap: draw B resamples with replacement, recompute.","Permutation: shuffle labels between groups, recompute.","Use the percentiles for a confidence interval or p-value."],
 pseudo:"Bootstrap percentile CI:\n  for b in 1..B:\n    sample_b = resample with replacement from data\n    theta_b = statistic(sample_b)\n  CI = [quantile(theta, alpha/2), quantile(theta, 1 - alpha/2)]\n\nPermutation test for two groups:\n  observed = |mean(A) - mean(B)|\n  for b in 1..B:\n    shuffle labels between A and B\n    diff_b = |mean(A_b) - mean(B_b)|\n  p = fraction of diff_b >= observed\n\nB typically 1000 to 10000.\nBootstrap works for means, medians, correlations, ratios.\nPermutation works for any exchangeable test statistic.",
 invariant:"The bootstrap assumes the sample is representative. The permutation test assumes exchangeability under the null.",
 uses:"Confidence intervals, hypothesis tests, small samples, non-Normal data.",
 strength:"Few assumptions. Works for complex statistics.",
 limits:"Fails for extreme order statistics and heavy tails. Slow for large B.",
 pitfall:"The naive bootstrap fails for the maximum or for time series (use block bootstrap for dependent data).",
 question:"How many bootstrap resamples are typical?",
 answer:"1000 for a rough CI, 10000 for stable p-values and confidence interval endpoints.",
 demo:"bootstrap",sample:"group A: 5.2 6.1 5.8 6.4 5.9 6.3 5.5 6.0\ngroup B: 6.8 7.1 6.5 7.3 6.9 7.0 7.2 6.7",refs:[
  ["Efron, Bootstrap methods: another look at the jackknife, Annals of Statistics 1979","https://doi.org/10.1214/aos/1176344552"],
  ["Efron and Tibshirani, An Introduction to the Bootstrap, Chapman & Hall 1993","https://www.routledge.com/An-Introduction-to-the-Bootstrap/Efron-Tibshirani/p/book/9780412042317"],
  ["Davison and Hinkley, Bootstrap Methods and Their Application, Cambridge 1997","https://www.cambridge.org/core/books/bootstrap-methods-and-their-application/"]]},
/* ================= 26.3 Statistical testing ================= */
{id:"z-t-test",title:"z-test, t-test and confidence intervals",level:3,kind:"Testing",status:"Runnable teaching lab",
 summary:"The t-test compares means when the variance is unknown. The z-test assumes a known variance. Both produce a p-value and a confidence interval for the effect size.",
 mental:"How many standard errors is the mean from the null?",
 mentalText:"The test statistic is (estimate - null) / standard error. For large samples the t distribution is close to Normal. For small samples the t distribution has heavier tails.",
 steps:["State the null and alternative hypotheses.","Compute the sample mean and standard error.","Compute t = (x_bar - mu_0) / (s / sqrt(n)).","Compare to the t distribution with n-1 degrees of freedom.","Report the p-value and the confidence interval."],
 pseudo:"One-sample t-test:\n  t = (x_bar - mu_0) / (s / sqrt(n))\n  df = n - 1\n  p = 2 * (1 - T_cdf(|t|, df))\n  CI = x_bar +/- t_{alpha/2, df} * s / sqrt(n)\n\nTwo-sample t-test (Welch):\n  t = (x1_bar - x2_bar) / sqrt(s1^2/n1 + s2^2/n2)\n  df = (s1^2/n1 + s2^2/n2)^2 /\n       [ (s1^2/n1)^2/(n1-1) + (s2^2/n2)^2/(n2-1) ]\n  p = 2 * (1 - T_cdf(|t|, df))\n\nPaired t-test:\n  compute differences d_i = x_i - y_i\n  run one-sample t-test on d\n\nAssumptions:\n  independence, approximate Normality or large n\n  Welch does not assume equal variances",
 invariant:"The p-value is the probability of a result at least as extreme as observed, assuming the null is true. It is not the probability the null is true.",
 uses:"A/B testing, clinical trials, quality control, comparing groups.",
 strength:"Simple, fast, well-understood. Confidence intervals give the effect size.",
 limits:"Sensitive to outliers and skewed data for small n. Multiple comparisons inflate Type I error.",
 pitfall:"A non-significant result does not prove the null. It may just be underpowered.",
 question:"What does a p-value of 0.03 mean?",
 answer:"If the null hypothesis were true, there is a 3% chance of observing a result at least as extreme. It does not mean the null is 3% likely.",
 demo:"ttest",sample:"5.2, 6.1, 5.8, 6.4, 5.9, 6.3, 5.5, 6.0\n6.8, 7.1, 6.5, 7.3, 6.9, 7.0, 7.2, 6.7",refs:[
  ["Student, The probable error of a mean, Biometrika 1908","https://doi.org/10.1093/biomet/6.1.1"],
  ["Welch, The generalization of Student's problem, Biometrika 1947","https://doi.org/10.1093/biomet/34.1-2.28"],
  ["Casella and Berger, Statistical Inference, Chapter 8","https://www.cengage.com/c/statistical-inference-2e-casella/9780534243128/"]]},
{id:"chi-square-anova",title:"Chi-square, Mann-Whitney and ANOVA",level:4,kind:"Testing",status:"Runnable teaching lab",
 summary:"Chi-square tests independence in contingency tables. Mann-Whitney is a nonparametric two-sample test. ANOVA compares means across three or more groups.",
 mental:"Compare observed counts or ranks to what the null predicts",
 mentalText:"Chi-square sums (observed - expected)^2 / expected. Mann-Whitney ranks the pooled data. ANOVA partitions variance into between-group and within-group.",
 steps:["Choose the test that matches the data and question.","Compute the test statistic.","Compare to the reference distribution.","Report the p-value and effect size."],
 pseudo:"Chi-square test of independence:\n  observed counts O_ij in an r x c table\n  expected E_ij = row_i * col_j / n\n  chi2 = sum (O_ij - E_ij)^2 / E_ij\n  df = (r - 1)(c - 1)\n\nMann-Whitney U (two samples):\n  rank the pooled data\n  R1 = sum of ranks in group 1\n  U1 = R1 - n1(n1+1)/2\n  U = min(U1, U2)\n  z = (U - n1 n2 / 2) / sqrt(n1 n2 (n1+n2+1)/12)\n\nOne-way ANOVA:\n  SSB = sum n_k (mean_k - grand_mean)^2\n  SSW = sum sum (x_ik - mean_k)^2\n  F = (SSB / (k-1)) / (SSW / (n - k))\n  df = (k - 1, n - k)\n\nANOVA with Welch correction for unequal variances.",
 invariant:"The F statistic is a ratio of variances. Under the null, the between-group variance and within-group variance estimate the same quantity.",
 uses:"A/B/C testing, clinical trials, survey analysis, quality control.",
 strength:"Handles multiple groups and non-Normal data (Mann-Whitney, Kruskal-Wallis).",
 limits:"ANOVA assumes Normality and equal variances. Chi-square needs adequate expected counts.",
 pitfall:"Running multiple pairwise t-tests instead of ANOVA inflates the Type I error. Use ANOVA followed by post-hoc corrections.",
 question:"When should you use Mann-Whitney instead of a t-test?",
 answer:"When the data is ordinal, heavily skewed, or has outliers, and you do not want to assume Normality. It tests whether one distribution tends to be larger than the other.",
 demo:"chi-square",sample:"30 20\n15 35",refs:[
  ["Pearson, On the criterion that a given system of deviations... is such that it can be reasonably supposed to have arisen from random sampling, 1900","https://doi.org/10.1080/14786440009463897"],
  ["Mann and Whitney, On a test of whether one of two random variables is stochastically larger than the other, Annals of Math Stat 1947","https://doi.org/10.1214/aoms/1177730491"],
  ["Fisher, Statistical Methods for Research Workers, Oliver and Boyd 1925","https://archive.org/details/statisticalmeth00fish"]]},
{id:"multiple-testing",title:"Multiple-testing correction",level:4,kind:"Testing",status:"Runnable teaching lab",
 summary:"Testing many hypotheses inflates the family-wise error rate. Bonferroni controls the FWER; Benjamini-Hochberg controls the false discovery rate (FDR).",
 mental:"Many tests, many false positives unless you correct",
 mentalText:"With 100 independent tests at alpha=0.05 and no true effects, you expect 5 false positives. Correction makes the threshold stricter.",
 steps:["Collect all p-values.","Bonferroni: compare each p to alpha/m.","Holm: sort p-values, compare to alpha/(m - rank + 1).","BH: sort p-values, compare to (rank/m) * alpha."],
 pseudo:"Bonferroni:\n  reject H_i if p_i < alpha / m\n  controls FWER <= alpha\n\nHolm (step-down):\n  sort p_(1) <= p_(2) <= ... <= p_(m)\n  find the smallest k with p_(k) > alpha / (m - k + 1)\n  reject H_(1) ... H_(k-1)\n\nBenjamini-Hochberg (FDR):\n  sort p_(1) <= ... <= p_(m)\n  find the largest k with p_(k) <= (k/m) * alpha\n  reject H_(1) ... H_(k)\n\nFWER = probability of at least one false positive\nFDR = expected proportion of false positives among rejections\n\nBH is less conservative than Bonferroni when many tests are truly null.",
 invariant:"Correction methods are valid under independence or positive dependence (BH).",
 uses:"Genomics, neuroimaging, A/B testing with many metrics, feature selection.",
 strength:"Controls error rates. BH has more power than Bonferroni.",
 limits:"Bonferroni is conservative. BH assumes independence or PRDS.",
 pitfall:"Correcting for all tests when only a subset is relevant wastes power. Pre-register the family of tests.",
 question:"What is the difference between FWER and FDR?",
 answer:"FWER is the probability of at least one false positive. FDR is the expected proportion of false positives among the rejections. FDR is more permissive.",
 demo:"multiple-testing",sample:"0.001 0.008 0.039 0.041 0.042 0.06 0.074 0.205 0.212 0.216 0.222 0.251 0.269 0.275 0.34",refs:[
  ["Bonferroni, Teoria statistica delle classi e calcolo delle probabilità, 1936","https://www.jstor.org/stable/2341718"],
  ["Holm, A simple sequentially rejective multiple test procedure, Scandinavian J. Statistics 1979","https://www.jstor.org/stable/4615733"],
  ["Benjamini and Hochberg, Controlling the false discovery rate, JRSS B 1995","https://doi.org/10.1111/j.2517-6161.1995.tb02031.x"]]},
/* ================= 26.4 Bayesian methods ================= */
{id:"bayes-inference",title:"Bayesian inference and conjugate models",level:4,kind:"Bayesian",status:"Runnable teaching lab",
 summary:"Bayesian inference combines a prior with a likelihood to produce a posterior. Conjugate priors give closed-form posteriors. Beta-Binomial is the classic example.",
 mental:"Start with a prior, update with data, get a posterior",
 mentalText:"The posterior is proportional to prior times likelihood. With a conjugate prior, the posterior has the same family as the prior and can be written down in closed form.",
 steps:["Choose a prior for the parameter.","Write the likelihood of the data given the parameter.","Multiply and normalize.","Report the posterior mean, mode and credible interval."],
 pseudo:"Bayes:\n  p(theta | data) ∝ p(data | theta) * p(theta)\n\nBeta-Binomial:\n  prior: theta ~ Beta(alpha, beta)\n  likelihood: k successes in n trials\n  posterior: theta ~ Beta(alpha + k, beta + n - k)\n  posterior mean: (alpha + k) / (alpha + beta + n)\n  credible interval: quantiles of the Beta posterior\n\nNormal-Normal with known variance:\n  prior: mu ~ N(mu_0, tau^2)\n  likelihood: x_bar ~ N(mu, sigma^2/n)\n  posterior: mu ~ N(mu_n, tau_n^2)\n  mu_n = (mu_0/tau^2 + n x_bar/sigma^2) / (1/tau^2 + n/sigma^2)\n  tau_n^2 = 1 / (1/tau^2 + n/sigma^2)\n\nJeffreys prior: non-informative, parameterization invariant",
 invariant:"The posterior is a probability distribution. Credible intervals have a direct probability interpretation.",
 uses:"A/B testing, clinical trials, recommender systems, uncertainty quantification.",
 strength:"Direct probability statements. Easy to update with new data.",
 limits:"Prior sensitivity with small samples. Computation for non-conjugate models.",
 pitfall:"A very informative prior can dominate the data. Report prior sensitivity analyses.",
 question:"What is a conjugate prior?",
 answer:"A prior that, when combined with the likelihood, gives a posterior in the same family. It makes Bayesian updating closed-form.",
 demo:"beta-binomial",sample:"30 100 1 1",refs:[
  ["Gelman et al., Bayesian Data Analysis, 3rd ed., CRC 2013","https://www.routledge.com/Bayesian-Data-Analysis/Gelman-Carlin-Stern-Dunson-Vehtari-Rubin/p/book/9781439840955"],
  ["Robert, The Bayesian Choice, 2nd ed., Springer 2007","https://link.springer.com/book/10.1007/978-0-387-71599-5"],
  ["McElreath, Statistical Rethinking, 2nd ed., CRC 2020","https://xcelab.net/rm/statistical-rethinking/"]]},
{id:"conjugate",title:"Conjugate models and posterior summaries",level:4,kind:"Bayesian",status:"Runnable teaching lab",
 summary:"Conjugate models are Bayesian models where the posterior is in the same family as the prior. They give closed-form updates and are the building blocks of hierarchical models.",
 mental:"Priors and posteriors live in the same family",
 mentalText:"Beta-Binomial for proportions. Normal-Normal for means. Gamma-Poisson for rates. Dirichlet-Multinomial for categorical data.",
 steps:["Identify the data type and likelihood.","Choose the conjugate prior family.","Update the hyperparameters with the data.","Compute posterior summaries."],
 pseudo:"Conjugate pairs:\n  Beta-Binomial:      proportions\n  Normal-Normal:      means (known variance)\n  Gamma-Poisson:      rates and counts\n  Dirichlet-Multinomial: categorical\n  Inverse-Gamma-Normal: variance\n\nPosterior summaries:\n  mean: E[theta | data]\n  mode: argmax p(theta | data)\n  credible interval: [q(alpha/2), q(1 - alpha/2)]\n\nPosterior predictive:\n  p(x_new | data) = integral p(x_new | theta) p(theta | data) d theta\n  For Beta-Binomial:\n    p(x_new = 1 | data) = posterior mean of theta\n  = (alpha + k) / (alpha + beta + n)",
 invariant:"The conjugate update is exact. No MCMC or approximation is needed.",
 uses:"Bayesian A/B testing, hierarchical models, sequential updating, Thompson sampling.",
 strength:"Closed form. Fast. Easy to extend to hierarchies.",
 limits:"Limited to specific likelihood-prior pairs. Real models often need MCMC or VI.",
 pitfall:"The posterior mean is not the same as the posterior mode unless the posterior is symmetric.",
 question:"What is the posterior predictive probability for Beta-Binomial?",
 answer:"The posterior mean of theta, (alpha + k) / (alpha + beta + n). It is the probability of a success in the next trial.",
 demo:"normal-normal",sample:"10 5 0 10\n12 5 0 10\n11 5 0 10",refs:[
  ["Gelman et al., Bayesian Data Analysis, Chapter 2-3","https://www.routledge.com/Bayesian-Data-Analysis/Gelman-Carlin-Stern-Dunson-Vehtari-Rubin/p/book/9781439840955"],
  ["Murphy, Machine Learning: A Probabilistic Perspective, MIT Press 2012","https://mitpress.mit.edu/9780262018029/machine-learning/"],
  ["Bishop, Pattern Recognition and Machine Learning, Springer 2006","https://link.springer.com/book/10.1007/978-0-387-45528-0"]]},
{id:"mcmc-vi",title:"MCMC and variational inference",level:5,kind:"Bayesian computation",status:"Runnable teaching lab",
 summary:"MCMC samples from the posterior by constructing a Markov chain with the posterior as its stationary distribution. Variational inference approximates the posterior with a simpler distribution by maximizing the ELBO.",
 mental:"MCMC samples; VI optimizes",
 mentalText:"MCMC: propose a move, accept or reject based on the posterior ratio. VI: pick a family of approximate posteriors, optimize the parameters to be close to the true posterior.",
 steps:["MCMC: initialize, propose a new state, accept with the Metropolis ratio.","VI: choose a family q(theta; phi), maximize the ELBO.","MCMC: run many iterations and discard a burn-in.","VI: check the ELBO convergence and posterior predictive."],
 pseudo:"Metropolis-Hastings:\n  initialize theta\n  for t in 1..T:\n    theta' ~ q(theta' | theta)\n    alpha = min(1, p(theta') q(theta | theta') / (p(theta) q(theta' | theta)))\n    u ~ Uniform(0, 1)\n    if u < alpha: theta = theta'\n    record theta\n  discard burn-in, use the rest for inference\n\nVariational inference:\n  choose q(theta; phi), e.g. mean-field Gaussian\n  ELBO(phi) = E_q[log p(data, theta)] - E_q[log q(theta)]\n  maximize ELBO over phi by gradient ascent\n  posterior approx: q(theta; phi*)\n\nMCMC: asymptotically exact, slow, hard to diagnose\nVI: approximate, fast, scales to large data",
 invariant:"MCMC requires the chain to be irreducible and aperiodic. VI requires the ELBO to be a lower bound on the log evidence.",
 uses:"Bayesian models with no conjugate prior, hierarchical models, topic models, deep generative models.",
 strength:"MCMC is asymptotically exact. VI scales to large data and models.",
 limits:"MCMC is slow and needs diagnostics (R-hat, ESS). VI underestimates posterior variance.",
 pitfall:"MCMC chains can get stuck. Always run multiple chains and check R-hat and trace plots.",
 question:"What does the ELBO lower-bound?",
 answer:"The log marginal likelihood (log evidence) log p(data). Maximizing the ELBO is equivalent to minimizing the KL divergence from q to the posterior.",
 demo:"metropolis",sample:"0 1 5000",refs:[
  ["Metropolis et al., Equation of state calculations by fast computing machines, J. Chem. Phys. 1953","https://doi.org/10.1063/1.1699114"],
  ["Hastings, Monte Carlo sampling methods using Markov chains and their applications, Biometrika 1970","https://doi.org/10.1093/biomet/57.1.97"],
  ["Blei, Kucukelbir, McAuliffe, Variational inference: A review for statisticians, JASA 2017","https://doi.org/10.1080/01621459.2017.1285773"]]},
/* ================= 26.5 Regression ================= */
{id:"linear-regression",title:"Linear regression and OLS",level:3,kind:"Regression",status:"Runnable teaching lab",
 summary:"Ordinary least squares fits a linear model by minimizing the sum of squared residuals. It has a closed-form solution and is the base for many statistical methods.",
 mental:"Find the line that minimizes squared vertical distance",
 mentalText:"The OLS estimates are beta = (X'X)^-1 X'y. The fitted values are X beta. The residuals are y - X beta.",
 steps:["Set up the design matrix X and response y.","Compute beta = (X'X)^-1 X'y.","Compute fitted values and residuals.","Compute R^2 = 1 - SSR/SST.","Run diagnostics on the residuals."],
 pseudo:"OLS:\n  X: n x p design matrix (column of 1s for intercept)\n  y: n x 1 response\n  beta_hat = (X'X)^-1 X'y\n  y_hat = X beta_hat\n  residuals = y - y_hat\n\nR^2:\n  SSR = sum residuals^2\n  SST = sum (y - y_bar)^2\n  R^2 = 1 - SSR/SST\n\nStandard errors:\n  sigma^2_hat = SSR / (n - p)\n  Var(beta_hat) = sigma^2_hat (X'X)^-1\n  se(beta_j) = sqrt(Var_jj)\n  t_j = beta_j / se(beta_j), df = n - p\n\nAssumptions:\n  linearity, independence, homoscedasticity, Normality of errors\n  no perfect multicollinearity",
 invariant:"OLS is the best linear unbiased estimator (BLUE) under the Gauss-Markov assumptions.",
 uses:"Economics, science, forecasting, causal inference, ML baselines.",
 strength:"Closed form. Interpretable coefficients. Well-understood inference.",
 limits:"Sensitive to outliers. Assumes linearity. Multicollinearity inflates standard errors.",
 pitfall:"Correlation does not imply causation. Omitted variables bias the coefficients.",
 question:"What does R^2 measure?",
 answer:"The proportion of variance in y explained by the model. R^2 = 1 means perfect fit; R^2 = 0 means no better than the mean.",
 demo:"ols",sample:"1 2.1\n2 3.9\n3 6.2\n4 7.8\n5 10.1\n6 12.2\n7 13.8\n8 16.1",refs:[
  ["Legendre, Nouvelles méthodes pour la détermination des orbites des comètes, 1805","https://gallica.bnf.fr/ark:/12148/bpt6k110193z"],
  ["Gauss, Theoria combinationis observationum erroribus minimis obnoxiae, 1823","https://archive.org/details/theoriacombinati00gaus"],
  ["Draper and Smith, Applied Regression Analysis, 3rd ed., Wiley 1998","https://www.wiley.com/en-us/Applied+Regression+Analysis%2C+3rd+Edition-p-9780471170822"]]},
{id:"logistic-glm",title:"Logistic regression and GLMs",level:4,kind:"Regression",status:"Runnable teaching lab",
 summary:"Logistic regression models a binary outcome with a sigmoid link. Generalized linear models (GLMs) extend linear regression to non-Normal responses via a link function.",
 mental:"Model the log-odds as a linear function",
 mentalText:"log(p/(1-p)) = X beta. The inverse is p = 1/(1+exp(-X beta)). Fit by maximum likelihood with gradient descent or IRLS.",
 steps:["Write the linear predictor eta = X beta.","Apply the link function to get the mean.","Write the log-likelihood.","Maximize by gradient ascent or IRLS.","Report coefficients as odds ratios."],
 pseudo:"Logistic regression:\n  p_i = 1 / (1 + exp(-x_i' beta))\n  log-likelihood: sum [y_i log p_i + (1 - y_i) log(1 - p_i)]\n  gradient: X'(y - p)\n  Hessian: -X' W X, W = diag(p(1-p))\n  Newton step: beta_new = beta + (X'WX)^-1 X'(y-p)\n\nCoefficient interpretation:\n  exp(beta_j) = odds ratio for a one-unit change in x_j\n\nGLM components:\n  random component: distribution of y (Normal, Binomial, Poisson)\n  systematic component: eta = X beta\n  link function: g(mu) = eta\n\nCommon links:\n  Normal: identity\n  Binomial: logit\n  Poisson: log\n  Gamma: inverse",
 invariant:"The log-likelihood is concave for logistic regression, so any local maximum is global.",
 uses:"Credit scoring, medical diagnosis, marketing response, churn prediction.",
 strength:"Probabilistic outputs. Interpretable odds ratios. Well-calibrated with enough data.",
 limits:"Assumes linearity in the log-odds. Sensitive to separation. Needs large samples for rare events.",
 pitfall:"Perfect separation gives infinite coefficients. Use regularization (ridge or Firth) to fix it.",
 question:"How do you interpret a logistic regression coefficient?",
 answer:"exp(beta_j) is the multiplicative change in odds for a one-unit increase in x_j, holding other variables constant.",
 demo:"logistic",sample:"1 0\n2 0\n3 0\n4 1\n5 0\n6 1\n7 1\n8 1\n9 1\n10 1",refs:[
  ["McCullagh and Nelder, Generalized Linear Models, 2nd ed., Chapman & Hall 1989","https://www.routledge.com/Generalized-Linear-Models/McCullagh-Nelder/p/book/9780412317606"],
  ["Hosmer, Lemeshow, Sturdivant, Applied Logistic Regression, 3rd ed., Wiley 2013","https://www.wiley.com/en-us/Applied+Logistic+Regression%2C+3rd+Edition-p-9780470582473"],
  ["Agresti, Categorical Data Analysis, 3rd ed., Wiley 2012","https://www.wiley.com/en-us/Categorical+Data+Analysis%2C+3rd+Edition-p-9780470463635"]]},
{id:"regularization",title:"Regularization, ridge and lasso",level:4,kind:"Regression",status:"Runnable teaching lab",
 summary:"Regularization adds a penalty to the loss to control model complexity. Ridge (L2) shrinks coefficients; lasso (L1) sets some to zero for variable selection.",
 mental:"Add a penalty for large coefficients",
 mentalText:"Ridge: minimize RSS + lambda * sum beta^2. Lasso: minimize RSS + lambda * sum |beta|. Elastic net combines both.",
 steps:["Standardize the predictors.","Choose the penalty and lambda.","Fit the regularized model.","Use cross-validation to tune lambda.","Interpret the coefficients."],
 pseudo:"Ridge (L2):\n  minimize ||y - X beta||^2 + lambda ||beta||_2^2\n  closed form: beta = (X'X + lambda I)^-1 X'y\n  shrinks coefficients toward zero, none exactly zero\n\nLasso (L1):\n  minimize ||y - X beta||^2 + lambda ||beta||_1\n  no closed form; coordinate descent or LARS\n  sets some coefficients exactly to zero (sparse)\n\nElastic net:\n  minimize ||y - X beta||^2 + lambda [alpha ||beta||_1 + (1-alpha) ||beta||_2^2]\n\nCross-validation:\n  split data into k folds\n  for each lambda, compute CV error\n  pick lambda minimizing CV error\n  refit on the full data",
 invariant:"The penalty is not applied to the intercept. Standardize predictors so the penalty is fair.",
 uses:"High-dimensional regression, genomics, text classification, feature selection.",
 strength:"Reduces overfitting. Lasso selects variables. Ridge handles multicollinearity.",
 limits:"Biased estimates. Lambda must be tuned. Lasso is unstable with correlated predictors.",
 pitfall:"Do not penalize the intercept. Standardize predictors before regularizing.",
 question:"What is the difference between ridge and lasso?",
 answer:"Ridge shrinks coefficients toward zero but keeps them all. Lasso can set coefficients exactly to zero, giving sparse solutions.",
 demo:"ridge",sample:"0.5\n1 2.1\n2 3.9\n3 6.2\n4 7.8\n5 10.1\n6 12.2\n7 13.8\n8 16.1",refs:[
  ["Hoerl and Kennard, Ridge regression: biased estimation for nonorthogonal problems, Technometrics 1970","https://doi.org/10.1080/00401706.1970.10488634"],
  ["Tibshirani, Regression shrinkage and selection via the lasso, JRSS B 1996","https://doi.org/10.1111/j.2517-6161.1996.tb02080.x"],
  ["Hastie, Tibshirani, Friedman, The Elements of Statistical Learning, 2nd ed., Springer 2009","https://link.springer.com/book/10.1007/978-0-387-84858-7"]]},
/* ================= 26.6 Survival ================= */
{id:"kaplan-meier",title:"Kaplan-Meier and log-rank test",level:4,kind:"Survival",status:"Runnable teaching lab",
 summary:"Kaplan-Meier estimates the survival function from censored data. The log-rank test compares survival curves between groups.",
 mental:"Estimate survival step by step, adjusting for censoring",
 mentalText:"At each event time, multiply the survival by (1 - events / at risk). Censored observations leave the risk set without an event.",
 steps:["Sort event and censoring times.","At each event time, compute the risk set.","Multiply the survival estimate by (1 - d/n).","Plot the step function.","Log-rank: compare observed and expected events in each group."],
 pseudo:"Kaplan-Meier:\n  sort unique event times t_1 < t_2 < ...\n  n_i = number at risk just before t_i\n  d_i = number of events at t_i\n  S(t) = prod_{t_i <= t} (1 - d_i / n_i)\n  Greenwood variance:\n    Var(S(t)) = S(t)^2 sum d_i / (n_i (n_i - d_i))\n\nLog-rank test:\n  O_g = observed events in group g\n  E_g = expected events under the null\n  chi2 = sum (O_g - E_g)^2 / E_g\n  df = number of groups - 1",
 invariant:"Censoring must be non-informative: the censoring time is independent of the survival time given the covariates.",
 uses:"Clinical trials, reliability engineering, customer churn, time-to-event analysis.",
 strength:"Handles censoring. No parametric assumption on the survival distribution.",
 limits:"Assumes non-informative censoring. Does not adjust for covariates (use Cox for that).",
 pitfall:"Treating censored observations as events biases the survival curve downward.",
 question:"What does censoring mean in survival analysis?",
 answer:"The event has not been observed by the end of follow-up. The subject is known to have survived at least until the censoring time.",
 demo:"kaplan-meier",sample:"5 1\n6 0\n6 1\n7 1\n8 0\n9 1\n10 1\n12 0",refs:[
  ["Kaplan and Meier, Nonparametric estimation from incomplete observations, JASA 1958","https://doi.org/10.1080/01621459.1958.10501452"],
  ["Mantel, Evaluation of survival data and two new rank order statistics arising in its consideration, Cancer Chemotherapy Reports 1966","https://pubmed.ncbi.nlm.nih.gov/5910392/"],
  ["Klein and Moeschberger, Survival Analysis, 2nd ed., Springer 2003","https://link.springer.com/book/10.1007/b97377"]]},
{id:"cox-model",title:"Cox proportional hazards",level:5,kind:"Survival",status:"Concept lesson",
 summary:"The Cox model estimates the effect of covariates on the hazard without specifying the baseline hazard. It assumes proportional hazards: hazard ratios are constant over time.",
 mental:"Model the hazard ratio, not the baseline hazard",
 mentalText:"h(t | x) = h_0(t) exp(beta'x). The baseline hazard h_0(t) is left unspecified. The coefficients are estimated by partial likelihood.",
 steps:["Write the hazard as baseline times exp(beta'x).","Write the partial likelihood over the event times.","Maximize the partial likelihood.","Check the proportional hazards assumption."],
 pseudo:"Cox model:\n  h(t | x) = h_0(t) exp(beta' x)\n\nPartial likelihood:\n  L(beta) = prod_{i: event} exp(beta' x_i) /\n            sum_{j in risk set at t_i} exp(beta' x_j)\n\nLog partial likelihood:\n  l(beta) = sum_{i: event} [beta' x_i - log sum_{j in R_i} exp(beta' x_j)]\n\nEstimation: Newton-Raphson on l(beta)\n\nInterpretation:\n  exp(beta_j) = hazard ratio for a one-unit increase in x_j\n\nProportional hazards check:\n  Schoenfeld residuals\n  log(-log(S(t))) plots should be parallel\n  time-varying coefficients",
 invariant:"The proportional hazards assumption must hold. If not, the hazard ratio is not a single number.",
 uses:"Clinical trials, epidemiology, reliability, customer churn.",
 strength:"Semiparametric. No baseline hazard needed. Handles censoring.",
 limits:"Proportional hazards assumption. Ties in event times need Breslow or Efron correction.",
 pitfall:"Testing the proportional hazards assumption is mandatory. Violations need stratified or time-varying models.",
 question:"What does exp(beta) mean in a Cox model?",
 answer:"The hazard ratio: the multiplicative change in the hazard for a one-unit increase in the covariate, holding others constant.",
 demo:"none",sample:"",refs:[
  ["Cox, Regression models and life-tables, JRSS B 1972","https://doi.org/10.1111/j.2517-6161.1972.tb00899.x"],
  ["Therneau and Grambsch, Modeling Survival Data, Springer 2000","https://link.springer.com/book/10.1007/978-1-4757-3294-8"],
  ["Klein and Moeschberger, Survival Analysis, 2nd ed., Springer 2003","https://link.springer.com/book/10.1007/b97377"]]},
{id:"competing-risks",title:"Competing risks",level:5,kind:"Survival",status:"Concept lesson",
 summary:"Competing risks occur when a subject can experience one of several mutually exclusive events. The cumulative incidence function (CIF) is the right summary, not 1 - KM.",
 mental:"Multiple event types, only one can happen",
 mentalText:"Cause-specific hazards model the rate of each event. The CIF gives the probability of each event type over time, accounting for the other events.",
 steps:["Define the event types.","Estimate cause-specific hazards.","Compute the cumulative incidence function for each cause.","Compare CIFs between groups."],
 pseudo:"Cause-specific hazard:\n  h_k(t) = lim_{dt->0} P(t <= T < t+dt, cause = k | T >= t) / dt\n\nCumulative incidence function:\n  CIF_k(t) = integral_0^t h_k(u) S(u) du\n  S(u) = exp(- sum_k integral_0^u h_k(s) ds)\n\nNot the same as 1 - KM:\n  1 - KM_k treats the other events as censoring,\n  which overestimates the cumulative incidence.\n\nFine-Gray subdistribution hazard:\n  models the CIF directly\n  useful for prediction and risk scores\n\nCause-specific Cox:\n  fit a Cox model for each cause\n  interpret as the effect on the cause-specific hazard",
 invariant:"The sum of all CIFs approaches 1 as t -> infinity. Each CIF is a probability, not a hazard.",
 uses:"Medical trials with death from different causes, credit risk with multiple default types.",
 strength:"Correct summary when events compete. CIF has a direct probability interpretation.",
 limits:"Cause-specific hazards and subdistribution hazards answer different questions.",
 pitfall:"Using 1 - Kaplan-Meier for each cause overestimates the cumulative incidence. Use the CIF.",
 question:"Why is 1 - KM wrong for competing risks?",
 answer:"It treats the competing events as censoring, which assumes they could still happen later. The CIF correctly accounts for the fact that once a competing event occurs, the other event cannot.",
 demo:"competing-risks",sample:"5 1\n6 2\n6 1\n7 1\n8 2\n9 1\n10 1\n12 2",refs:[
  ["Fine and Gray, A proportional hazards model for the subdistribution of a competing risk, JASA 1999","https://doi.org/10.1080/01621459.1999.10474144"],
  ["Putter, Fiocco, Geskus, Tutorial in biostatistics: competing risks and multi-state models, Statistics in Medicine 2007","https://doi.org/10.1002/sim.2712"],
  ["Austin, Lee, Fine, Introduction to the analysis of survival data in the presence of competing risks, Circulation 2016","https://doi.org/10.1161/CIRCULATIONAHA.115.017719"]]},
/* ================= 26.7 Time-series foundations ================= */
{id:"ts-foundations",title:"Time series foundations",level:3,kind:"Time series",status:"Runnable teaching lab",
 summary:"Time series have trend, seasonality, cycles and noise. Autocorrelation measures how a series correlates with its own lagged values. Stationarity is the key assumption for ARMA models.",
 mental:"A series correlated with its own past",
 mentalText:"The autocorrelation function (ACF) plots correlation against lag. The partial autocorrelation function (PACF) plots the direct correlation at each lag, removing intermediate lags.",
 steps:["Plot the series and look for trend and seasonality.","Compute the ACF and PACF.","Test for stationarity (ADF, KPSS).","Difference or detrend if needed."],
 pseudo:"Autocovariance at lag k:\n  gamma_k = (1/n) sum_{t=1}^{n-k} (x_t - x_bar)(x_{t+k} - x_bar)\n\nAutocorrelation:\n  rho_k = gamma_k / gamma_0\n\nPartial autocorrelation:\n  PACF(k) = correlation between x_t and x_{t-k}\n            after removing the effect of lags 1..k-1\n\nStationarity:\n  mean and variance constant over time\n  autocovariance depends only on lag, not on t\n\nAugmented Dickey-Fuller:\n  H0: unit root (non-stationary)\n  H1: stationary\n  reject H0 for small p-value\n\nKPSS:\n  H0: stationary\n  H1: unit root",
 invariant:"Stationarity is required for most classical time-series models. Non-stationary series need differencing or detrending.",
 uses:"Forecasting, signal processing, econometrics, anomaly detection.",
 strength:"Simple diagnostics. Guides model selection.",
 limits:"ACF and PACF are hard to read for mixed or seasonal series. Tests have low power in small samples.",
 pitfall:"Spurious regression: regressing two independent non-stationary series often gives a high R^2 by chance.",
 question:"How do ACF and PACF identify ARMA models?",
 answer:"AR(p): ACF decays gradually, PACF cuts off after lag p. MA(q): ACF cuts off after lag q, PACF decays gradually. ARMA: both decay gradually.",
 demo:"acf",sample:"1.2 1.5 1.8 2.1 2.4 2.7 3.0 3.3 3.6 3.9 4.2 4.5 4.8 5.1 5.4",refs:[
  ["Box, Jenkins, Reinsel, Ljung, Time Series Analysis: Forecasting and Control, 5th ed., Wiley 2015","https://www.wiley.com/en-us/Time+Series+Analysis%3A+Forecasting+and+Control%2C+5th+Edition-p-9781118675021"],
  ["Hamilton, Time Series Analysis, Princeton 1994","https://press.princeton.edu/books/hardcover/9780691042893/time-series-analysis"],
  ["Hyndman and Athanasopoulos, Forecasting: Principles and Practice, 3rd ed., OTexts 2021","https://otexts.com/fpp3/"]]},
{id:"decomposition",title:"Decomposition and moving averages",level:3,kind:"Time series",status:"Runnable teaching lab",
 summary:"Classical decomposition splits a series into trend, seasonal and residual components. Moving averages smooth the series and estimate the trend.",
 mental:"Trend plus season plus noise",
 mentalText:"Additive: x_t = T_t + S_t + R_t. Multiplicative: x_t = T_t * S_t * R_t. Estimate the trend with a centered moving average, then compute seasonal indices.",
 steps:["Choose additive or multiplicative.","Estimate the trend with a moving average.","Detrend: x - T or x / T.","Average by season to get seasonal indices.","Compute residuals."],
 pseudo:"Centered moving average (period m):\n  for even m: T_t = (0.5 x_{t-m/2} + x_{t-m/2+1} + ... + 0.5 x_{t+m/2}) / m\n  for odd m:  T_t = mean(x_{t-(m-1)/2}, ..., x_{t+(m-1)/2})\n\nAdditive:\n  S_t = average of (x_t - T_t) for each season\n  normalize S so sum = 0\n  R_t = x_t - T_t - S_t\n\nMultiplicative:\n  S_t = average of (x_t / T_t) for each season\n  normalize S so mean = 1\n  R_t = x_t / (T_t * S_t)\n\nSTL: Seasonal-Trend decomposition using LOESS\n  robust to outliers\n  trend and season can vary over time",
 invariant:"The decomposition is not unique unless you fix the trend and seasonal forms. Different methods give different components.",
 uses:"Exploratory analysis, forecasting, seasonal adjustment, anomaly detection.",
 strength:"Simple and interpretable. Baseline for seasonal models.",
 limits:"Assumes a fixed seasonal pattern. Fails when seasonality evolves.",
 pitfall:"Using an additive model on multiplicative data (or vice versa) gives misleading components.",
 question:"When should you use a multiplicative decomposition?",
 answer:"When the seasonal amplitude grows with the level of the series, e.g. retail sales, energy demand.",
 demo:"decomposition",sample:"10 12 15 13 11 14 17 15 12 15 18 16 13 16 19 17",refs:[
  ["Makridakis, Wheelwright, Hyndman, Forecasting: Methods and Applications, 3rd ed., Wiley 1998","https://www.wiley.com/en-us/Forecasting%3A+Methods+and+Applications%2C+3rd+Edition-p-9780471532330"],
  ["Cleveland et al., STL: A seasonal-trend decomposition procedure based on loess, J. Official Statistics 1990","https://www.jstor.org/stable/41854629"],
  ["Hyndman and Athanasopoulos, Forecasting: Principles and Practice, 3rd ed., OTexts 2021","https://otexts.com/fpp3/"]]},
{id:"exp-smoothing",title:"Exponential smoothing",level:3,kind:"Time series",status:"Runnable teaching lab",
 summary:"Simple exponential smoothing weights recent observations more. Holt's method adds a trend component. Both are cheap, robust and surprisingly hard to beat.",
 mental:"A weighted average with exponentially decaying weights",
 mentalText:"SES: level l_t = alpha x_t + (1 - alpha) l_{t-1}. Forecast is flat at the level. Holt adds a trend b_t.",
 steps:["Choose alpha (level smoothing).","Update the level each period.","Forecast: for SES, flat; for Holt, level + h * trend.","Tune alpha (and beta) by minimizing the sum of squared forecast errors."],
 pseudo:"Simple exponential smoothing (SES):\n  l_t = alpha x_t + (1 - alpha) l_{t-1}\n  forecast: x_{t+h} = l_t\n\nHolt's linear trend:\n  l_t = alpha x_t + (1 - alpha)(l_{t-1} + b_{t-1})\n  b_t = beta (l_t - l_{t-1}) + (1 - beta) b_{t-1}\n  forecast: x_{t+h} = l_t + h b_t\n\nDamped trend:\n  forecast: l_t + (phi + phi^2 + ... + phi^h) b_t\n  phi in (0, 1) damps the trend\n\nAlpha, beta in [0, 1].\n  alpha near 1: react fast, noisy\n  alpha near 0: smooth, slow to adapt\n\nOptimal alpha minimizes SSE on a training set.",
 invariant:"The level update is a convex combination of the new observation and the previous level.",
 uses:"Demand forecasting, inventory, short-term operational forecasting.",
 strength:"Simple. Fast. Robust. Often beats complex models on short horizons.",
 limits:"No seasonality (use Holt-Winters). No uncertainty quantification (unless you add it).",
 pitfall:"Initializing the level and trend poorly biases early forecasts. Use a backcast or optimize the initial values.",
 question:"What does alpha control in SES?",
 answer:"The weight on the most recent observation. alpha near 1 means the forecast reacts quickly; alpha near 0 means it is smooth and slow to adapt.",
 demo:"ses-holt",sample:"0.5 0.3\n10 12 15 13 11 14 17 15 12 15 18 16 13 16 19 17",refs:[
  ["Brown, Exponential Smoothing for Predicting Demand, Arthur D. Little 1956","https://www.jstor.org/stable/10.2307/2343181"],
  ["Holt, Forecasting seasonals and trends by exponentially weighted moving averages, ONR Research Memorandum 1957","https://doi.org/10.1016/j.ijforecast.2003.09.015"],
  ["Hyndman et al., Forecasting with Exponential Smoothing: The State Space Approach, Springer 2008","https://link.springer.com/book/10.1007/978-3-540-71918-2"]]},
{id:"holt-winters",title:"Holt-Winters seasonal smoothing",level:4,kind:"Time series",status:"Runnable teaching lab",
 summary:"Holt-Winters extends exponential smoothing with a seasonal component. The additive version adds the season; the multiplicative version multiplies by it.",
 mental:"Level plus trend plus season, updated each period",
 mentalText:"Keep three running estimates: level, trend, seasonal. Update each with its own smoothing parameter. Forecast by combining all three.",
 steps:["Choose additive or multiplicative seasonality.","Initialize level, trend and seasonal indices.","Update the three components each period.","Forecast: level + h * trend + season (additive) or (level + h * trend) * season (multiplicative)."],
 pseudo:"Additive Holt-Winters:\n  l_t = alpha (x_t - s_{t-m}) + (1 - alpha)(l_{t-1} + b_{t-1})\n  b_t = beta (l_t - l_{t-1}) + (1 - beta) b_{t-1}\n  s_t = gamma (x_t - l_t) + (1 - gamma) s_{t-m}\n  forecast: x_{t+h} = l_t + h b_t + s_{t+h-m(k+1)}\n\nMultiplicative:\n  l_t = alpha (x_t / s_{t-m}) + (1 - alpha)(l_{t-1} + b_{t-1})\n  b_t = beta (l_t - l_{t-1}) + (1 - beta) b_{t-1}\n  s_t = gamma (x_t / l_t) + (1 - gamma) s_{t-m}\n  forecast: x_{t+h} = (l_t + h b_t) * s_{t+h-m(k+1)}\n\nm = seasonal period (4 for quarterly, 12 for monthly)\nalpha, beta, gamma in [0, 1]",
 invariant:"Seasonal indices must sum to zero (additive) or average to one (multiplicative).",
 uses:"Retail demand, energy load, call volume, web traffic.",
 strength:"Handles level, trend and seasonality. Widely used in industry.",
 limits:"Fixed seasonal pattern. Sensitive to initialization. Not great for long horizons.",
 pitfall:"Using additive HW on multiplicative data (or vice versa) gives biased forecasts. Plot the seasonal amplitude first.",
 question:"What is the difference between additive and multiplicative Holt-Winters?",
 answer:"Additive adds the seasonal component; multiplicative multiplies. Multiplicative is appropriate when the seasonal amplitude grows with the level.",
 demo:"holt-winters",sample:"4 0.3 0.1 0.2\n10 12 15 13 11 14 17 15 12 15 18 16 13 16 19 17",refs:[
  ["Winters, Forecasting sales by exponentially weighted moving averages, Management Science 1960","https://doi.org/10.1287/mnsc.6.3.324"],
  ["Hyndman et al., Forecasting with Exponential Smoothing: The State Space Approach, Springer 2008","https://link.springer.com/book/10.1007/978-3-540-71918-2"],
  ["Hyndman and Athanasopoulos, Forecasting: Principles and Practice, 3rd ed., OTexts 2021","https://otexts.com/fpp3/"]]},

{id:"ar-ma-arma",title:"AR, MA and ARMA models",level:4,kind:"Forecasting",status:"Runnable teaching lab",
 summary:"AR models the series as a function of its own lags. MA models it as a function of past errors. ARMA combines both for stationary series.",
 mental:"Today depends on yesterday and on yesterday's surprise",
 mentalText:"AR(p): x_t = c + phi_1 x_{t-1} + ... + phi_p x_{t-p} + e_t. MA(q): x_t = c + e_t + theta_1 e_{t-1} + ... + theta_q e_{t-q}.",
 steps:["Check stationarity.","Use ACF and PACF to identify orders.","Estimate parameters by MLE or Yule-Walker.","Check residual autocorrelation.","Forecast."],
 pseudo:"AR(p):\n  x_t = c + sum phi_i x_{t-i} + e_t\n  ACF: decays gradually\n  PACF: cuts off after lag p\n\nMA(q):\n  x_t = c + e_t + sum theta_j e_{t-j}\n  ACF: cuts off after lag q\n  PACF: decays gradually\n\nARMA(p, q):\n  x_t = c + sum phi_i x_{t-i} + e_t + sum theta_j e_{t-j}\n  both ACF and PACF decay gradually\n\nEstimation:\n  Yule-Walker (AR only, closed form)\n  conditional sum of squares\n  maximum likelihood (Gaussian innovations)\n\nModel selection:\n  AIC = -2 log L + 2 k\n  BIC = -2 log L + k log n\n  choose the model with the smallest AIC or BIC",
 invariant:"Stationarity of the AR polynomial (roots outside the unit circle) and invertibility of the MA polynomial are required for a well-defined model.",
 uses:"Economic forecasting, demand, finance, signal processing.",
 strength:"Well-understood. Fast to fit. Good short-term forecasts.",
 limits:"Linear and stationary. Cannot capture regime changes or volatility clustering.",
 pitfall:"Fitting ARMA to non-stationary data gives spurious results. Difference first if needed.",
 question:"How do ACF and PACF distinguish AR from MA?",
 answer:"AR(p): ACF decays, PACF cuts off after lag p. MA(q): ACF cuts off after lag q, PACF decays.",
 demo:"ar1",sample:"0.5 0.3\n1.2 1.5 1.8 2.1 2.4 2.7 3.0 3.3 3.6 3.9 4.2 4.5 4.8 5.1 5.4 4.5 3.6 2.7 1.8 0.9 0.0 -0.9 -1.8 -2.7",refs:[
  ["Box, Jenkins, Reinsel, Ljung, Time Series Analysis: Forecasting and Control, 5th ed., Wiley 2015","https://www.wiley.com/en-us/Time+Series+Analysis%3A+Forecasting+and+Control%2C+5th+Edition-p-9781118675021"],
  ["Hamilton, Time Series Analysis, Princeton 1994","https://press.princeton.edu/books/hardcover/9780691042893/time-series-analysis"],
  ["Shumway and Stoffer, Time Series Analysis and Its Applications, 4th ed., Springer 2017","https://link.springer.com/book/10.1007/978-3-319-52452-8"]]},
{id:"arima-sarima",title:"ARIMA and SARIMA",level:5,kind:"Forecasting",status:"Runnable teaching lab",
 summary:"ARIMA adds differencing to ARMA for non-stationary series. SARIMA adds seasonal AR, MA and differencing terms for seasonal data.",
 mental:"Difference away the trend, then fit ARMA",
 mentalText:"ARIMA(p, d, q): difference d times, then fit ARMA(p, q). SARIMA(p, d, q)(P, D, Q)_m adds seasonal terms with period m.",
 steps:["Determine d by differencing until stationary.","Determine D by seasonal differencing.","Use ACF/PACF to pick p, q, P, Q.","Fit by MLE.","Check residuals."],
 pseudo:"ARIMA(p, d, q):\n  y_t = (1 - B)^d x_t   (d-th difference)\n  y_t = c + sum phi_i y_{t-i} + e_t + sum theta_j e_{t-j}\n\nSARIMA(p, d, q)(P, D, Q)_m:\n  seasonal differencing: (1 - B^m)^D\n  seasonal AR: Phi(B^m) = 1 - Phi_1 B^m - ... - Phi_P B^{Pm}\n  seasonal MA: Theta(B^m) = 1 + Theta_1 B^m + ... + Theta_Q B^{Qm}\n  full model: Phi(B^m) phi(B) (1 - B)^d (1 - B^m)^D x_t\n            = Theta(B^m) theta(B) e_t\n\nAuto-ARIMA (Hyndman-Khandakar):\n  stepwise search over (p, d, q)(P, D, Q)\n  minimize AICc\n\nForecast:\n  point forecast + prediction interval from the innovation variance",
 invariant:"After differencing, the series must be stationary. Over-differencing introduces artificial MA structure.",
 uses:"Economic forecasting, demand, energy, web analytics.",
 strength:"Handles trend and seasonality. Well-established. Good baselines.",
 limits:"Linear. Fixed seasonality. Struggles with structural breaks.",
 pitfall:"Auto-ARIMA can pick a different model on slightly different data. Always check the residuals and forecast plausibility.",
 question:"What does the I in ARIMA stand for?",

from math import erf, exp, sqrt, log, factorial

def normal_pdf(x, mu=0, sigma=1):
    z = (x - mu) / sigma
    return exp(-0.5*z*z) / (sigma * sqrt(2*math.pi))

def normal_cdf(x, mu=0, sigma=1):
    return 0.5 * (1 + erf((x - mu) / (sigma * math.sqrt(2))))

def binomial_pmf(k, n, p):
    return math.comb(n, k) * p**k * (1-p)**(n-k)

def poisson_pmf(k, lam):
    return exp(-lam) * lam**k / factorial(k)

print("N(0,1) pdf at 0:", normal_pdf(0))
print("N(0,1) cdf at 1.96:", normal_cdf(1.96))
print("Bin(10, 0.5) pmf at 5:", binomial_pmf(5, 10, 0.5))
print("Pois(3) pmf at 2:", poisson_pmf(2, 3))

x = [2, 4, 4, 4, 5, 5, 7, 9, 100]

def quantile(x, p):
    x = sorted(x)
    h = (len(x) - 1) * p
    lo = int(h)
    hi = min(lo + 1, len(x) - 1)
    return x[lo] + (h - lo) * (x[hi] - x[lo])

median = statistics.median(x)

 "ols":{python:`def ols(X, y):
    # X: list of rows (each row is a feature vector)
    # y: list of targets
    n = len(X)
    p = len(X[0])
    # XtX and Xty
    XtX = [[sum(X[i][a]*X[i][b] for i in range(n)) for b in range(p)] for a in range(p)]
    Xty = [sum(X[i][a]*y[i] for i in range(n)) for a in range(p)]
    # Solve XtX * beta = Xty by Gaussian elimination
    A = [row[:] + [Xty[i]] for i, row in enumerate(XtX)]
    for i in range(p):
        pivot = max(range(i, p), key=lambda r: abs(A[r][i]))
        A[i], A[pivot] = A[pivot], A[i]
        for r in range(i+1, p):
            f = A[r][i] / A[i][i]
            for c in range(i, p+1):
                A[r][c] -= f * A[i][c]
    beta = [0]*p
    for i in range(p-1, -1, -1):
        beta[i] = (A[i][p] - sum(A[i][j]*beta[j] for j in range(i+1, p))) / A[i][i]

def logistic_fit(X, y, lr=0.1, epochs=2000):

def cif(data, cause):
    # data: list of (time, event) where event = 0 (censored), 1, 2, ...
    times = sorted(set(t for t, _ in data))
    n = len(data)
    S = 1.0
    cif_val = 0.0
    curve = []
    for t in times:
        at_risk = sum(1 for tt, _ in data if tt >= t)
        events_all = sum(1 for tt, e in data if tt == t and e > 0)
        events_cause = sum(1 for tt, e in data if tt == t and e == cause)

            cif_val += S * events_cause / at_risk
            S *= (1 - events_all / at_risk)
            curve.append((t, cif_val))

 "holt-winters":{python:`def holt_winters(x, m, alpha, beta, gamma):
    # Additive Holt-Winters
    n = len(x)
    # Initialize
    seasons = n // m
    level = sum(x[:m]) / m
    trend = (sum(x[m:2*m]) - sum(x[:m])) / (m*m)
    seasonals = [x[i] - level for i in range(m)]
    forecasts = []
    for t in range(n):
        if t >= m:
            s = seasonals[t % m]
            f = level + trend + s
            forecasts.append(f)
            prev_level = level
            level = alpha * (x[t] - s) + (1 - alpha) * (level + trend)
            trend = beta * (level - prev_level) + (1 - beta) * trend
            seasonals[t % m] = gamma * (x[t] - level) + (1 - gamma) * s
    return forecasts

def thompson(means, trials=1000):
    alphas = [1.0, 1.0, 1.0]
    betas = [1.0, 1.0, 1.0]

    for _ in range(trials):

        reward = 1 if random.random() < means[arm] else 0

  let sum=1/s,term=sum,n=1;
  while(n<300){
   term*=x/(s+n);
   sum+=term;
   if(Math.abs(term)<Math.abs(sum)*1e-13)break;
   n++;
  }
  return sum*Math.exp(-x+s*Math.log(x)-Math.log(gammaFn(s)));
 } else {
  let b=x+1-s,c=1e30,d=1/b,h=d;
  for(let i=1;i<300;i++){
   const an=-i*(i-s);
   b+=2;
   d=an*d+b;if(Math.abs(d)<1e-30)d=1e-30;
   c=b+an/c;if(Math.abs(c)<1e-30)c=1e-30;
   d=1/d;
   const del=d*c;
   h*=del;
   if(Math.abs(del-1)<1e-13)break;
  }
  const Q=Math.exp(-x+s*Math.log(x)-Math.log(gammaFn(s)))*h;
  return 1-Q;
 }
}
function chiSquareCDF(x,k){return lowerGammaReg(k/2,x/2)}
function betaInc(a,b,x){
 if(x<=0)return 0;
 if(x>=1)return 1;
 const lbeta=Math.log(gammaFn(a))+Math.log(gammaFn(b))-Math.log(gammaFn(a+b));
 const maxit=300,eps=1e-13,fpmin=1e-30;
 let qab=a+b,qap=a+1,qam=a-1;
 let c=1,d=1-qab*x/qap;
 if(Math.abs(d)<fpmin)d=fpmin;
 d=1/d;let h=d;
 for(let m=1;m<=maxit;m++){
  const m2=2*m;
  let aa=m*(b-m)*x/((qam+m2)*(a+m2));
  d=1+aa*d;if(Math.abs(d)<fpmin)d=fpmin;
  c=1+aa/c;if(Math.abs(c)<fpmin)c=fpmin;
  d=1/d;h*=d*c;
  aa=-(a+m)*(qab+m)*x/((a+m2)*(qap+m2));
  d=1+aa*d;if(Math.abs(d)<fpmin)d=fpmin;
  c=1+aa/c;if(Math.abs(c)<fpmin)c=fpmin;
  d=1/d;
  const del=d*c;h*=del;
  if(Math.abs(del-1)<eps)break;
 }
 return Math.exp(a*Math.log(x)+b*Math.log(1-x)-lbeta)*h/a;
}
function tCDF(x,df){const p=0.5*betaInc(df/2,0.5,df/(df+x*x));return x>=0?1-p:p}
function fCDF(x,d1,d2){return betaInc(d1/2,d2/2,d1*x/(d1*x+d2))}

/* ============================================================
   Utilities
   ============================================================ */
function parseNums(s){
 const a=s.trim().split(/[\s,]+/).filter(Boolean).map(Number);
 if(!a.length||a.some(x=>!Number.isFinite(x)))throw Error('Enter space or comma separated numbers.');
 return a;
}
function fmtNum(x,d=4){
 if(!Number.isFinite(x))return String(x);
 if(Math.abs(x)<1e-14)return '0';
 if(Math.abs(x)>=1e6||(Math.abs(x)<1e-4&&x!==0))return x.toExponential(d-1);
 return parseFloat(x.toFixed(d)).toString();
}
function rngFactory(seed){let s=seed>>>0;return ()=>{s=(s*1103515245+12345)&0x7fffffff;return s/0x7fffffff}}
function mean(a){return a.reduce((x,y)=>x+y,0)/a.length}
function variance(a,ddof=1){const m=mean(a);return a.reduce((s,x)=>s+(x-m)*(x-m),0)/(a.length-ddof)}
function stdev(a,ddof=1){return Math.sqrt(variance(a,ddof))}
function median(a){const b=[...a].sort((x,y)=>x-y);const n=b.length;return n%2?b[(n-1)/2]:(b[n/2-1]+b[n/2])/2}
function quantile(a,p){const b=[...a].sort((x,y)=>x-y);const h=(b.length-1)*p;const lo=Math.floor(h);const hi=Math.min(lo+1,b.length-1);return b[lo]+(h-lo)*(b[hi]-b[lo])}
function mad(a){const m=median(a);return median(a.map(x=>Math.abs(x-m)))}
function linspace(a,b,n){const out=[];for(let i=0;i<n;i++)out.push(a+(b-a)*i/(n-1));return out}

/* ---- SVG line plot ---- */
function linePlotSVG(series,opts={}){
 const width=opts.width||700,height=opts.height||240;
 const padL=opts.padL||48,padR=15,padT=15,padB=opts.padB||30;
 let xMin=Infinity,xMax=-Infinity,yMin=Infinity,yMax=-Infinity;
 for(const s of series)for(const [x,y] of s.points){
  if(!Number.isFinite(x)||!Number.isFinite(y))continue;
  if(x<xMin)xMin=x;if(x>xMax)xMax=x;
  if(y<yMin)yMin=y;if(y>yMax)yMax=y;
 }
 if(!isFinite(xMin)){xMin=0;xMax=1;yMin=0;yMax=1}
 if(xMin===xMax)xMax=xMin+1;
 if(yMin===yMax)yMax=yMin+1;
 const yr=yMax-yMin;yMin-=yr*0.05;yMax+=yr*0.05;
 const px=x=>padL+(x-xMin)/(xMax-xMin)*(width-padL-padR);
 const py=y=>height-padB-(y-yMin)/(yMax-yMin)*(height-padT-padB);
 let out='';
 out+=`<line x1="${padL}" y1="${height-padB}" x2="${width-padR}" y2="${height-padB}" stroke="var(--line2)"/>`;
 out+=`<line x1="${padL}" y1="${padT}" x2="${padL}" y2="${height-padB}" stroke="var(--line2)"/>`;
 const colors=['var(--accent)','var(--good)','var(--warn)','var(--bad)','var(--strong)'];
 series.forEach((s,si)=>{
  const col=s.color||colors[si%colors.length];
  const pts=s.points.filter(p=>Number.isFinite(p[0])&&Number.isFinite(p[1]));
  if(pts.length===1){
   out+=`<circle cx="${px(pts[0][0]).toFixed(1)}" cy="${py(pts[0][1]).toFixed(1)}" r="4" fill="${col}"/>`;
   return;
  }
  let path='';
  pts.forEach(([x,y],i)=>{path+=i===0?`M ${px(x).toFixed(1)} ${py(y).toFixed(1)}`:` L ${px(x).toFixed(1)} ${py(y).toFixed(1)}`});
  out+=`<path d="${path}" fill="none" stroke="${col}" stroke-width="2"/>`;
  if(s.dots)for(const [x,y] of pts)out+=`<circle cx="${px(x).toFixed(1)}" cy="${py(y).toFixed(1)}" r="2.5" fill="${col}"/>`;
 });
 out+=`<text x="${padL-6}" y="${py(yMax)+4}" text-anchor="end" font-size="10" fill="var(--subtle)" font-family="monospace">${fmtNum(yMax,2)}</text>`;
 out+=`<text x="${padL-6}" y="${py(yMin)+4}" text-anchor="end" font-size="10" fill="var(--subtle)" font-family="monospace">${fmtNum(yMin,2)}</text>`;
 out+=`<text x="${px(xMin)}" y="${height-padB+14}" text-anchor="middle" font-size="10" fill="var(--subtle)" font-family="monospace">${fmtNum(xMin,2)}</text>`;
 out+=`<text x="${px(xMax)}" y="${height-padB+14}" text-anchor="middle" font-size="10" fill="var(--subtle)" font-family="monospace">${fmtNum(xMax,2)}</text>`;
 if(series.length>1){
  let lx=padL+8,ly=padT+12;
  series.forEach((s,si)=>{
   if(!s.label)return;
   const col=s.color||colors[si%colors.length];
   out+=`<rect x="${lx}" y="${ly-8}" width="10" height="10" fill="${col}"/>`;
   out+=`<text x="${lx+14}" y="${ly}" font-size="10" fill="var(--muted)">${esc(s.label)}</text>`;
   lx+=14+String(s.label).length*7+16;
  });
 }
 return `<svg class="plot" viewBox="0 0 ${width} ${height}" xmlns="http://www.w3.org/2000/svg">${out}</svg>`;
}

/* 26.1 distributions */
function demoDistributions(text){
 const parts=text.trim().split(/\s+/);
 const name=(parts[0]||'normal').toLowerCase();
 const series=[];
 let summary='';
 if(name.startsWith('norm')){
  const mu=parseFloat(parts[1]||0),sigma=parseFloat(parts[2]||1);
  const xs=linspace(mu-4*sigma,mu+4*sigma,121);
  series.push({label:`Normal(${mu}, ${sigma}^2)`,points:xs.map(x=>[x,normalPDF(x,mu,sigma)])});
  summary=`Normal(mu=${mu}, sigma=${sigma})\n  mean = ${mu}\n  variance = ${sigma*sigma}\n  sd = ${sigma}\n  P(-1 < Z < 1) = ${(normalCDF(1)-normalCDF(-1)).toFixed(4)}\n  P(-2 < Z < 2) = ${(normalCDF(2)-normalCDF(-2)).toFixed(4)}\n  P(-3 < Z < 3) = ${(normalCDF(3)-normalCDF(-3)).toFixed(4)}`;
 } else if(name.startsWith('binom')||name.startsWith('bin')){
  const n=Math.max(1,parseInt(parts[1]||10)),p=Math.min(1,Math.max(0,parseFloat(parts[2]||0.5)));
  const pts=[];
  for(let k=0;k<=n;k++){
   const logc=gammaFn(n+1)-gammaFn(k+1)-gammaFn(n-k+1);
   const pmf=Math.exp(logc)*Math.pow(p,k)*Math.pow(1-p,n-k);
   pts.push([k,pmf]);
  }
  series.push({label:`Binomial(${n}, ${p})`,points:pts,dots:true});
  summary=`Binomial(n=${n}, p=${p})\n  mean = ${n*p}\n  variance = ${n*p*(1-p)}\n  sd = ${Math.sqrt(n*p*(1-p)).toFixed(4)}`;
 } else if(name.startsWith('pois')){
  const lam=Math.max(0.01,parseFloat(parts[1]||3));
  const maxK=Math.max(10,Math.ceil(lam+5*Math.sqrt(lam)));
  const pts=[];
  for(let k=0;k<=maxK;k++){
   const logpmf=-lam+k*Math.log(lam)-gammaFn(k+1);
   pts.push([k,Math.exp(logpmf)]);
  }
  series.push({label:`Poisson(${lam})`,points:pts,dots:true});
  summary=`Poisson(lambda=${lam})\n  mean = ${lam}\n  variance = ${lam}\n  sd = ${Math.sqrt(lam).toFixed(4)}`;
 } else {
  throw Error('Unknown distribution. Use "normal mu sigma", "binomial n p" or "poisson lambda".');
 }
 return {
  html:linePlotSVG(series,{height:240}),
  encoded:`Distribution: ${name}\n\n${summary}`,
  decoded:`The plot shows the PDF (continuous) or PMF (discrete). The summary lists the mean, variance and standard deviation of the distribution.`
 };
}

/* 26.1 bayes */
function demoBayes(text){
 const parts=text.trim().split(/\s+/).map(Number);
 if(parts.length<3)throw Error('Enter: prior sensitivity specificity.');
 const [prior,sens,spec]=parts;
 if(prior<0||prior>1||sens<0||sens>1||spec<0||spec>1)throw Error('All values must be in [0, 1].');
 const pPos=sens*prior+(1-spec)*(1-prior);
 const posterior=sens*prior/pPos;
 const pNeg=(1-sens)*prior+spec*(1-prior);
 const posteriorNeg=(1-sens)*prior/pNeg;
 return {
  encoded:`Prior P(D) = ${prior}\nSensitivity P(+ | D) = ${sens}\nSpecificity P(- | ~D) = ${spec}\n\nP(+) = ${fmtNum(pPos,6)}\nP(D | +) = ${fmtNum(posterior,6)}\n\nP(-) = ${fmtNum(pNeg,6)}\nP(D | -) = ${fmtNum(posteriorNeg,6)}\n\nInterpretation:\n  Before the test: ${(prior*100).toFixed(2)}% chance of disease.\n  After a positive test: ${(posterior*100).toFixed(2)}% chance.\n  After a negative test: ${(posteriorNeg*100).toFixed(2)}% chance.`,
  decoded:`Bayes' theorem updates the prior with the test result. A positive result on a rare disease is often a false positive because the base rate is low.`
 };
}

/* 26.2 bootstrap */
function demoBootstrap(text){
 const lines=text.trim().split(/\n/).filter(Boolean);
 if(lines.length<2)throw Error('Enter two lines: group A and group B.');
 const parse=(l)=>{const m=l.match(/:?\s*(.+)$/);return m?m[1].split(/[\s,]+/).filter(Boolean).map(Number):[]};
 const A=parse(lines[0]);
 const B=parse(lines[1]);
 if(A.length<2||B.length<2)throw Error('Each group needs at least 2 numbers.');
 const rand=rngFactory(12345);
 const B_=3000;
 function bootstrapCI(x,alpha=0.05){
  const n=x.length;
  const means=[];
  for(let i=0;i<B_;i++){
   let s=0;
   for(let j=0;j<n;j++)s+=x[Math.floor(rand()*n)];
   means.push(s/n);
  }
  means.sort((a,b)=>a-b);
  return [means[Math.floor(B_*alpha/2)],means[Math.floor(B_*(1-alpha/2))]];
 }
 function permutationP(a,b){
  const obs=Math.abs(mean(a)-mean(b));
  const pooled=[...a,...b];
  const na=a.length;
  let count=0;
  for(let i=0;i<B_;i++){
   for(let j=pooled.length-1;j>0;j--){
    const k=Math.floor(rand()*(j+1));
    [pooled[j],pooled[k]]=[pooled[k],pooled[j]];
   }
   const da=Math.abs(mean(pooled.slice(0,na))-mean(pooled.slice(na)));
   if(da>=obs)count++;
  }
  return count/B_;
 }
 const [loA,hiA]=bootstrapCI(A);
 const [loB,hiB]=bootstrapCI(B);
 const p=permutationP(A,B);
 return {
  encoded:`Group A: n=${A.length}, mean=${fmtNum(mean(A),4)}\nGroup B: n=${B.length}, mean=${fmtNum(mean(B),4)}\n\nBootstrap 95% CI for A mean: [${fmtNum(loA,4)}, ${fmtNum(hiA,4)}]\nBootstrap 95% CI for B mean: [${fmtNum(loB,4)}, ${fmtNum(hiB,4)}]\n\nPermutation test p-value: ${fmtNum(p,4)}\n${p<0.05?'Significant at alpha = 0.05':'Not significant at alpha = 0.05'}`,
  decoded:`The bootstrap resamples with replacement to estimate the sampling distribution. The permutation test shuffles labels to build the null distribution. Both avoid parametric assumptions.`
 };
}

/* 26.3 t-test */
function demoTtest(text){
 const lines=text.trim().split(/\n/).filter(Boolean);
 if(lines.length<2)throw Error('Enter two lines: one per group.');
 const A=parseNums(lines[0]);
 const B=parseNums(lines[1]);
 if(A.length<2||B.length<2)throw Error('Each group needs at least 2 numbers.');
 const n1=A.length,n2=B.length;
 const m1=mean(A),m2=mean(B);
 const s1=stdev(A),s2=stdev(B);
 const se=Math.sqrt(s1*s1/n1+s2*s2/n2);
 const t=(m1-m2)/se;
 const df=Math.pow(s1*s1/n1+s2*s2/n2,2)/(Math.pow(s1*s1/n1,2)/(n1-1)+Math.pow(s2*s2/n2,2)/(n2-1));
 const p=2*(1-tCDF(Math.abs(t),df));
 const diff=m1-m2;
 const tcrit=normalInv(0.975); // approx
 const ci=[diff-tcrit*se,diff+tcrit*se];
 const pooled=Math.sqrt(((n1-1)*s1*s1+(n2-1)*s2*s2)/(n1+n2-2));
 const cohend=diff/pooled;
 return {
  encoded:`Group A: n=${n1}, mean=${fmtNum(m1,4)}, sd=${fmtNum(s1,4)}\nGroup B: n=${n2}, mean=${fmtNum(m2,4)}, sd=${fmtNum(s2,4)}\n\nWelch t-test:\n  t = ${fmtNum(t,4)}\n  df = ${fmtNum(df,2)}\n  p = ${fmtNum(p,6)}\n  mean difference = ${fmtNum(diff,4)}\n  95% CI (approx): [${fmtNum(ci[0],4)}, ${fmtNum(ci[1],4)}]\n  Cohen's d = ${fmtNum(cohend,4)}\n\n${p<0.05?'Reject H0 at alpha = 0.05':'Fail to reject H0 at alpha = 0.05'}`,
  decoded:`Welch's t-test does not assume equal variances. The p-value is the probability of a difference at least this extreme under the null. The CI gives the plausible range for the difference.`
 };
}

/* 26.3 chi-square */
function demoChiSquare(text){
 const lines=text.trim().split(/\n/).filter(Boolean);
 const table=lines.map(l=>l.split(/[\s,]+/).filter(Boolean).map(Number));
 if(table.length<2||table[0].length<2)throw Error('Enter a contingency table with at least 2 rows and 2 columns.');
 const rows=table.length,cols=table[0].length;
 const rowSums=table.map(r=>r.reduce((a,b)=>a+b,0));
 const colSums=Array.from({length:cols},(_,j)=>table.reduce((s,r)=>s+r[j],0));
 const n=rowSums.reduce((a,b)=>a+b,0);
 let chi2=0;
 const expected=table.map((r,i)=>r.map((v,j)=>rowSums[i]*colSums[j]/n));
 for(let i=0;i<rows;i++)for(let j=0;j<cols;j++){
  const e=expected[i][j];
  chi2+=(table[i][j]-e)**2/e;
 }
 const df=(rows-1)*(cols-1);
 const p=1-chiSquareCDF(chi2,df);
 return {
  encoded:`Table:\n${table.map(r=>'  '+r.join(' ')).join('\n')}\n\nRow sums: [${rowSums.join(', ')}]\nCol sums: [${colSums.join(', ')}]\nTotal: ${n}\n\nExpected counts:\n${expected.map(r=>'  '+r.map(v=>fmtNum(v,2)).join(' ')).join('\n')}\n\nchi2 = ${fmtNum(chi2,4)}\ndf = ${df}\np = ${fmtNum(p,6)}\n\n${p<0.05?'Significant association at alpha = 0.05':'No significant association at alpha = 0.05'}`,
  decoded:`The chi-square test compares observed counts to expected counts under independence. Large chi-square means the variables are associated.`
 };
}

/* 26.3 multiple testing */
function demoMultipleTesting(text){
 const p=parseNums(text);
 const m=p.length;
 const alpha=0.05;
 // Bonferroni
 const bonf=p.map(v=>v<alpha/m);
 // Holm
 const order=p.map((v,i)=>({v,i})).sort((a,b)=>a.v-b.v);
 const holm=Array(m).fill(false);
 let holmStop=false;
 for(let k=0;k<m;k++){
  const threshold=alpha/(m-k);
  if(!holmStop&&order[k].v<=threshold){holm[order[k].i]=true}
  else{holmStop=true}
 }
 // BH
 const bh=Array(m).fill(false);
 let bhMax=-1;
 for(let k=0;k<m;k++){
  if(order[k].v<=(k+1)/m*alpha)bhMax=k;
 }
 if(bhMax>=0)for(let k=0;k<=bhMax;k++)bh[order[k].i]=true;
 const count=(arr)=>arr.filter(Boolean).length;
 return {
  encoded:`p-values (${m}):\n  ${p.map(v=>fmtNum(v,4)).join(' ')}\n\nBonferroni (alpha/m = ${fmtNum(alpha/m,4)}):\n  Rejected: ${p.map((v,i)=>bonf[i]?i+1:null).filter(x=>x!==null).join(', ')||'(none)'}\n  Count: ${count(bonf)}\n\nHolm step-down:\n  Rejected: ${p.map((v,i)=>holm[i]?i+1:null).filter(x=>x!==null).join(', ')||'(none)'}\n  Count: ${count(holm)}\n\nBenjamini-Hochberg FDR:\n  Rejected: ${p.map((v,i)=>bh[i]?i+1:null).filter(x=>x!==null).join(', ')||'(none)'}\n  Count: ${count(bh)}`,
  decoded:`Bonferroni controls the family-wise error rate. Holm is a step-down improvement. BH controls the false discovery rate and is less conservative.`
 };
}

/* 26.4 beta-binomial */
function demoBetaBinomial(text){

 if(parts.length<4)throw Error('Enter: successes trials prior_alpha prior_beta.');
 const [k,n,a,b]=parts;
 if(k<0||n<0||k>n)throw Error('Need 0 <= successes <= trials.');
 const A=a+k,B=b+n-k;
 const postMean=A/(A+B);
 const postMode=(A>1&&B>1)?(A-1)/(A+B-2):postMean;

 const xs=linspace(0.001,0.999,200);
 const pdf=xs.map(x=>{
  const logp=(A-1)*Math.log(x)+(B-1)*Math.log(1-x)-(gammaFn(A)+gammaFn(B)-gammaFn(A+B))*0 + Math.log(1);
  const logB=Math.log(gammaFn(A))+Math.log(gammaFn(B))-Math.log(gammaFn(A+B));
  return [x,Math.exp((A-1)*Math.log(x)+(B-1)*Math.log(1-x)-logB)];
 });
 return {
  html:linePlotSVG([{label:`Beta(${A}, ${B})`,points:pdf}],{height:220}),
  encoded:`Data: ${k} successes in ${n} trials\nPrior: Beta(${a}, ${b})\n\nPrior mean: ${fmtNum(priorMean,4)}\nMLE: ${fmtNum(mle,4)}\n\nPosterior: Beta(${A}, ${B})\nPosterior mean: ${fmtNum(postMean,4)}\nPosterior mode: ${fmtNum(postMode,4)}\n\nPosterior 95% credible interval (approx):\n  [${fmtNum(quantileFromBeta(A,B,0.025),4)}, ${fmtNum(quantileFromBeta(A,B,0.975),4)}]`,
  decoded:`The Beta-Binomial conjugate update adds successes to alpha and failures to beta. The posterior is a Beta distribution with the updated parameters.`
 };
}
function quantileFromBeta(a,b,p){
 // numeric inversion via bisection
 let lo=0,hi=1;
 for(let i=0;i<60;i++){
  const mid=(lo+hi)/2;
  if(betaInc(a,b,mid)<p)lo=mid;else hi=mid;
 }
 return (lo+hi)/2;
}

 if(!lines.length)throw Error('Enter lines: x known_var prior_mean prior_var.');
 const data=[];
 let knownVar=1,priorMean=0,priorVar=10;
 for(const l of lines){
  const p=l.split(/[\s,]+/).filter(Boolean).map(Number);
  if(p.length===4){data.push(p[0]);knownVar=p[1];priorMean=p[2];priorVar=p[3]}
  else if(p.length===1)data.push(p[0]);
 }
 if(!data.length)throw Error('No data found.');
 const n=data.length;
 const xbar=mean(data);
 const postVar=1/(1/priorVar+n/knownVar);
 const postMean=postVar*(priorMean/priorVar+n*xbar/knownVar);
 return {
  encoded:`Data: [${data.join(', ')}]\nKnown variance: ${knownVar}\nPrior: N(${priorMean}, ${priorVar})\n\nSample mean: ${fmtNum(xbar,4)}\n\nPosterior: N(${fmtNum(postMean,4)}, ${fmtNum(postVar,4)})\nPosterior sd: ${fmtNum(Math.sqrt(postVar),4)}\n\n95% credible interval:\n  [${fmtNum(postMean-1.96*Math.sqrt(postVar),4)}, ${fmtNum(postMean+1.96*Math.sqrt(postVar),4)}]`,
  decoded:`The posterior mean is a precision-weighted average of the prior mean and the sample mean. More data or a tighter prior pulls the posterior toward it.`
 };
}

/* 26.4 metropolis */
function demoMetropolis(text){
 const parts=text.trim().split(/\s+/).map(Number);
 const mu=parts[0]||0,sd=parts[1]||1,n=Math.max(100,Math.min(parts[2]||5000,50000));
 const rand=rngFactory(42);
 let x=0;
 const samples=[];
 let accepted=0;
 const proposalSd=1;
 for(let i=0;i<n;i++){
  const xProp=x+proposalSd*(Math.sqrt(-2*Math.log(rand()+1e-12))*Math.cos(2*Math.PI*rand()));
  const logAlpha=-0.5*Math.pow((xProp-mu)/sd,2)+0.5*Math.pow((x-mu)/sd,2);
  if(Math.log(rand()+1e-12)<logAlpha){x=xProp;accepted++}
  samples.push(x);
 }
 const burn=Math.floor(n*0.1);
 const kept=samples.slice(burn);
 const postMean=mean(kept);
 const postSd=stdev(kept);
 const hist=new Array(40).fill(0);
 const lo=Math.min(...kept),hi=Math.max(...kept);
 for(const v of kept){
  const idx=Math.min(39,Math.floor((v-lo)/(hi-lo+1e-9)*40));
  hist[idx]++;
 }
 const histPts=hist.map((c,i)=>[lo+(i+0.5)*(hi-lo)/40,c/kept.length]);
 return {
  html:linePlotSVG([{label:'Metropolis samples',points:histPts}],{height:220}),
  encoded:`Target: N(${mu}, ${sd}^2)\nIterations: ${n}\nAcceptance rate: ${fmtNum(accepted/n,4)}\n\nPosterior mean: ${fmtNum(postMean,4)}\nPosterior sd: ${fmtNum(postSd,4)}\n\nTrue mean: ${mu}\nTrue sd: ${sd}`,
  decoded:`Metropolis-Hastings proposes a new state, accepts with probability min(1, posterior ratio). The chain converges to the target distribution.`
 };
}

/* 26.5 OLS */
function demoOls(text){
 const lines=text.trim().split(/\n/).filter(Boolean);
 const pts=lines.map(l=>l.split(/[\s,]+/).filter(Boolean).map(Number));
 if(pts.length<2)throw Error('Enter at least 2 (x y) pairs.');
 const X=pts.map(p=>[1,p[0]]);
 const y=pts.map(p=>p[1]);
 // OLS closed form for simple regression
 const n=X.length;
 const xbar=mean(pts.map(p=>p[0]));
 const ybar=mean(y);
 let num=0,den=0;
 for(let i=0;i<n;i++){num+=(pts[i][0]-xbar)*(y[i]-ybar);den+=(pts[i][0]-xbar)**2}
 const slope=num/den;
 const intercept=ybar-slope*xbar;
 let ssr=0,sst=0;
 for(let i=0;i<n;i++){const pred=intercept+slope*pts[i][0];ssr+=(y[i]-pred)**2;sst+=(y[i]-ybar)**2}
 const r2=1-ssr/sst;
 const sigma2=ssr/(n-2);
 const seSlope=Math.sqrt(sigma2/den);
 const tStat=slope/seSlope;
 const p=2*(1-tCDF(Math.abs(tStat),n-2));
 // plot
 const xs=linspace(Math.min(...pts.map(p=>p[0])),Math.max(...pts.map(p=>p[0])),50);
 const linePts=xs.map(x=>[x,intercept+slope*x]);
 const dataPts=pts.map(p=>[p[0],p[1]]);
 return {
  html:linePlotSVG([
   {label:'Data',points:dataPts,dots:true,color:'var(--accent)'},
   {label:'OLS fit',points:linePts,color:'var(--good)'}
  ],{height:240}),
  encoded:`n = ${n}\nintercept = ${fmtNum(intercept,4)}\nslope = ${fmtNum(slope,4)}\n\nR^2 = ${fmtNum(r2,4)}\nResidual variance = ${fmtNum(sigma2,4)}\nse(slope) = ${fmtNum(seSlope,4)}\nt = ${fmtNum(tStat,4)}\np = ${fmtNum(p,6)}`,
  decoded:`OLS minimizes the sum of squared residuals. The slope is the estimated change in y per unit change in x. R^2 is the fraction of variance explained.`
 };
}

/* 26.5 logistic */
function demoLogistic(text){
 const lines=text.trim().split(/\n/).filter(Boolean);
 const pts=lines.map(l=>l.split(/[\s,]+/).filter(Boolean).map(Number));
 if(pts.length<3)throw Error('Enter at least 3 (x y) pairs with y in {0,1}.');
 const X=pts.map(p=>[1,p[0]]);
 const y=pts.map(p=>p[1]);
 const n=X.length;
 const p=2;
 const sigmoid=z=>1/(1+Math.exp(-z));
 let beta=[0,0];
 for(let it=0;it<3000;it++){
  const grad=[0,0];
  for(let i=0;i<n;i++){
   const z=beta[0]*X[i][0]+beta[1]*X[i][1];
   const pred=sigmoid(z);
   const err=pred-y[i];
   grad[0]+=err*X[i][0];
   grad[1]+=err*X[i][1];
  }
  beta[0]-=0.1*grad[0]/n;
  beta[1]-=0.1*grad[1]/n;
 }
 const xs=linspace(Math.min(...pts.map(p=>p[0]))-0.5,Math.max(...pts.map(p=>p[0]))+0.5,100);
 const curve=xs.map(x=>[x,sigmoid(beta[0]+beta[1]*x)]);
 const dataPts=pts.map(p=>[p[0],p[1]]);
 const oddsRatio=Math.exp(beta[1]);
 return {
  html:linePlotSVG([
   {label:'Data',points:dataPts,dots:true,color:'var(--accent)'},
   {label:'Logistic fit',points:curve,color:'var(--good)'}
  ],{height:240}),
  encoded:`n = ${n}\nintercept = ${fmtNum(beta[0],4)}\nslope = ${fmtNum(beta[1],4)}\nodds ratio (per unit x) = ${fmtNum(oddsRatio,4)}\n\nInterpretation:\n  log-odds = ${fmtNum(beta[0],4)} + ${fmtNum(beta[1],4)} * x\n  a one-unit increase in x multiplies the odds by ${fmtNum(oddsRatio,4)}`,
  decoded:`Logistic regression models the log-odds as a linear function. The odds ratio exp(beta) is the multiplicative change in odds per unit change in x.`
 };
}

/* 26.5 ridge */
function demoRidge(text){
 const lines=text.trim().split(/\n/).filter(Boolean);
 if(!lines.length)throw Error('Enter lambda on the first line, then x y pairs.');
 const lambda=parseFloat(lines[0])||0;
 const pts=lines.slice(1).map(l=>l.split(/[\s,]+/).filter(Boolean).map(Number));
 if(pts.length<2)throw Error('Need at least 2 (x y) pairs.');

 let num=0,den=0;

 const slopeOls=num/den;

  decoded:`Ridge adds a penalty lambda * beta^2 to the loss. It shrinks coefficients toward zero. The intercept is usually not penalized.`
 };
