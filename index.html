<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="description" content="A beginner-friendly Statistics, Probability and Time Series learning lab covering distributions, inference, Bayesian methods, regression, survival and forecasting.">
  <title>aznur / Statistics &amp; Time Series Lab</title>
<style>

:root{
  --font:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --radius:4px; --radius-sm:3px; --radius-lg:6px;
  color-scheme:dark;

  --bg:#161313;
  --panel:#1c1818;
  --panel2:#211d1d;
  --panel3:#211d1d;
  --line:#302c2c;
  --line2:#454040;
  --text:#f1eeee;
  --muted:#9a9898;
  --subtle:#646262;
  --accent:#f59e0b;
  --accent-hover:#d97706;
  --strong:#f1eeee;
  --good:#10b981;
  --warn:#f59e0b;
  --bad:#f87171;
  --shadow:none;

  --lab-bg:#141110;
  --lab-deep:#0f0d0b;
  --lab-toolbar:#1a1613;
  --lab-border:#2a2620;
  --lab-text:#f5f5f4;
  --lab-muted:#a8a29e;
  --lab-amber:#f59e0b;
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#fdfcfc; --panel:#faf8f7; --panel2:#f4f0ef; --panel3:#f4f0ef;
  --line:#dcd9d9; --line2:#c8c4c4;
  --text:#201d1d; --muted:#646262; --subtle:#9a9898;
  --accent:#b45309; --accent-hover:#92400e; --strong:#201d1d;
  --good:#10b981; --warn:#b45309; --bad:#b91c1c;
}

/* ============================================================
   RESET & BASE
   ============================================================ */
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; min-width:320px;
  background:var(--bg); color:var(--text);
  font:13.5px/1.55 var(--font);
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  font-variant-numeric:tabular-nums;
}
button,input,select,textarea{font:inherit;font-family:var(--font)}
button,a,select{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button{cursor:pointer}
a{color:var(--accent);text-decoration:none}
a:hover{color:var(--accent-hover);text-decoration:underline}
button:focus-visible,input:focus-visible,select:focus-visible,
textarea:focus-visible,a:focus-visible,summary:focus-visible{
  outline:2px solid var(--accent); outline-offset:2px; border-radius:var(--radius-sm);
}
[hidden]{display:none!important}
.muted{color:var(--muted)}
h1,h2,h3,h4{font-weight:600;letter-spacing:-0.01em}

/* ============================================================
   HEADER & BRAND
   ============================================================ */
.topbar{
  min-height:56px; position:sticky; top:0; z-index:20;
  display:flex; align-items:center; gap:16px;
  padding:0 20px; background:var(--bg);
  border-bottom:1px solid var(--line);
}
.brand{
  display:inline-flex; align-items:baseline; gap:6px;
  min-width:max-content; color:var(--text); font-size:12.5px;
}
.brand:hover{text-decoration:none}
.brand-word{color:var(--text);font-weight:600}
.brand-divider{color:var(--subtle);font-weight:500}
.brand-name{color:var(--muted);font-weight:500}
.top-meta{flex:1;min-width:0;color:var(--subtle);font-size:10.5px}
.top-actions{display:flex;align-items:center;gap:6px}
.top-actions label{color:var(--subtle);font-size:10px;text-transform:uppercase;letter-spacing:.1em}

/* ============================================================
   CONTROLS
   ============================================================ */
select,.btn{
  min-height:30px;
  border:1px solid var(--line2); border-radius:var(--radius);
  background:var(--panel3); color:var(--text);
  padding:6px 10px; font-size:11.5px; line-height:1.3;
}
.btn{font-weight:500;white-space:nowrap;transition:border-color .12s, color .12s}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);color:#161313;border-color:var(--accent)}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover);color:#161313}
:root[data-theme="light"] .btn.primary{color:#fdfcfc}
:root[data-theme="light"] .btn.primary:hover{color:#fdfcfc}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* ============================================================
   LAYOUT & SIDEBAR
   ============================================================ */
.layout{
  display:grid;
  grid-template-columns:238px minmax(0,1fr);
  max-width:1740px; margin:0 auto;
  min-height:calc(100vh - 56px);
}
.sidebar{
  position:sticky; top:56px; height:calc(100vh - 56px);
  overflow:auto; border-right:1px solid var(--line);
  padding:18px 12px;
  display:flex; flex-direction:column; min-width:0;
}
.side-title{
  display:flex; justify-content:space-between; align-items:center; gap:8px;
  color:var(--subtle); font-size:9px; letter-spacing:.14em;
  font-weight:600; text-transform:uppercase;
  padding:0 4px 12px;
}
.pill,.tag{
  border:1px solid var(--line2); border-radius:var(--radius-sm);
  padding:2px 6px; font-size:9.5px; color:var(--muted);
  white-space:nowrap; font-weight:500;
}
.tag.good{color:var(--good);border-color:color-mix(in srgb,var(--good) 40%,var(--line2))}
.tag.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,var(--line2))}
.search{
  display:flex; gap:6px; align-items:center;
  border:1px solid var(--line); border-radius:var(--radius);
  background:var(--panel3); min-height:32px;
  padding:0 8px; margin-bottom:10px; color:var(--subtle);
}
.search input{
  min-width:0; width:100%; background:transparent;
  border:0; outline:0; color:var(--text); font-size:11px;
}
.search input::placeholder{color:var(--subtle)}
.search kbd,kbd{
  border:1px solid var(--line); border-radius:var(--radius-sm);
  padding:0 5px; color:var(--subtle); font-size:9.5px; background:var(--bg);
}
.filter{
  display:block; color:var(--subtle); font-size:10px;
  letter-spacing:.08em; text-transform:uppercase;
  font-weight:500; margin-bottom:12px;
}
.filter select{display:block;width:100%;margin-top:5px;padding:6px 8px;font-size:11px;text-transform:none;letter-spacing:0}
.tree{display:flex;flex-direction:column;gap:12px;min-width:0}
.group-label{
  display:flex; justify-content:space-between; gap:6px;
  color:var(--subtle); font-size:9px; font-weight:600;
  letter-spacing:.1em; text-transform:uppercase;
  padding:4px 6px;
}
.link{
  width:100%; text-align:left;
  display:flex; gap:8px; align-items:center;
  background:transparent; border:1px solid transparent;
  border-radius:var(--radius); color:var(--muted);
  padding:6px 8px; min-height:30px;
  transition:background .1s,color .1s,border-color .1s;
}
.link .num{font-size:9.5px;color:var(--subtle);width:20px;flex:none;font-variant-numeric:tabular-nums}
.link .name{font-size:11.5px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.link .done{color:var(--good);font-size:11px}
.link:hover{background:var(--panel2);color:var(--text)}
.link.active{background:var(--panel2);border-color:var(--line2);color:var(--text);font-weight:500}
.side-foot{margin-top:auto;border-top:1px solid var(--line);padding-top:12px}
.progress-row{
  display:flex; justify-content:space-between; gap:6px;
  color:var(--subtle); font-size:10px;
  letter-spacing:.06em; text-transform:uppercase;
  margin-bottom:6px;
}
.progress-row strong{color:var(--text);font-weight:500}
.progress{height:4px;background:var(--panel3);border-radius:2px;overflow:hidden}
.progress>div{height:100%;width:0;background:var(--accent);transition:width .25s ease}
.side-actions{display:flex;gap:6px;margin-top:10px}
.side-actions .btn{flex:1;padding:5px 6px;font-size:10.5px}

/* ============================================================
   MAIN
   ============================================================ */
main{
  max-width:1220px; width:100%; min-width:0;
  margin:0 auto; padding:22px 26px 40px;
}
.breadcrumb{
  font-size:9.5px; text-transform:uppercase; letter-spacing:.12em;
  color:var(--subtle); margin-bottom:12px;
}
.header{padding:2px 0 18px;border-bottom:1px solid var(--line);margin-bottom:16px}
.eyebrow{
  font-size:9.5px; text-transform:uppercase; letter-spacing:.14em;
  font-weight:600; color:var(--accent); margin-bottom:7px;
}
.header h1{font-size:22px;line-height:1.2;letter-spacing:-0.015em;margin:0 0 8px;font-weight:600}
.header p{font-size:13px;color:var(--muted);margin:0 0 12px;max-width:780px;line-height:1.6}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.header-actions{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}

/* ============================================================
   PANELS & CONTENT
   ============================================================ */
.panel{
  border:1px solid var(--line); background:var(--panel);
  border-radius:var(--radius); margin-bottom:12px;
  min-width:0; overflow:hidden;
}
.panel-head{padding:14px 16px 0}
.panel-head h2{font-size:12.5px;margin:0 0 3px;font-weight:600}
.panel-head p{font-size:11.5px;color:var(--muted);margin:0;line-height:1.55}
.body{padding:12px 16px 16px}

.idea{display:grid;grid-template-columns:minmax(0,1fr) 200px;gap:14px}
.idea p{font-size:12px;color:var(--muted);margin:0 0 10px;line-height:1.6}
.idea p strong{color:var(--text)}
.mental{background:var(--panel3);border:1px solid var(--line);border-radius:var(--radius);padding:11px}
.mental small{display:block;color:var(--subtle);font-size:9px;letter-spacing:.12em;text-transform:uppercase;font-weight:600}
.mental strong{display:block;margin:5px 0;font-size:12px;color:var(--text);font-weight:600;line-height:1.4}
.mental p{font-size:11px;color:var(--muted);margin:0;line-height:1.55}

.takeaway{
  padding:9px 11px; border:1px solid var(--line2);
  background:var(--panel3); border-radius:var(--radius);
  color:var(--text); font-size:12px; line-height:1.6;
}
.takeaway strong{color:var(--accent);font-weight:600}

.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini{background:var(--panel3);border:1px solid var(--line);border-radius:var(--radius);padding:11px;min-width:0}
.mini h3{font-size:11.5px;margin:0 0 6px;font-weight:600}
.mini p{font-size:11.5px;color:var(--muted);margin:0;line-height:1.6}

.steps{
  counter-reset:s; list-style:none; padding:0; margin:0;
  display:flex; flex-direction:column; gap:7px;
}
.steps li{
  counter-increment:s;
  display:flex; gap:8px; color:var(--muted);
  font-size:11.5px; line-height:1.6;
}
.steps li:before{
  content:counter(s);
  width:20px;height:20px;flex:none;
  display:grid;place-items:center;
  border:1px solid var(--line2);
  background:var(--panel3); border-radius:var(--radius-sm);
  color:var(--accent); font-size:10px;
  font-variant-numeric:tabular-nums; margin-top:1px;
}
.pseudo{
  white-space:pre-wrap; overflow:auto;
  background:var(--lab-bg); color:var(--lab-text);
  border:1px solid var(--lab-border); border-radius:var(--radius);
  padding:12px 14px; font:11.5px/1.7 var(--font); margin:0;
  overflow-wrap:anywhere;
}

.notice{
  padding:10px 12px;
  background:var(--panel3);
  border:1px solid color-mix(in srgb,var(--warn) 32%,var(--line));
  border-radius:var(--radius);
  font-size:11.5px; color:var(--muted); line-height:1.65;
}
.notice strong{color:var(--warn);font-weight:600}

/* ============================================================
   VISUAL LAB — dark stage
   ============================================================ */
.lab-top{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.lab-top label{
  font-size:10px; color:var(--subtle);
  text-transform:uppercase; letter-spacing:.08em;
  font-weight:600; margin-right:4px;
}
.lab-input{
  width:100%; min-height:90px; resize:vertical;
  background:var(--lab-bg);
  border:1px solid var(--lab-border); border-radius:var(--radius);
  padding:10px 12px; color:var(--lab-text);
  font:11.5px/1.6 var(--font); margin:10px 0;
}
.lab-input:focus-visible{outline-color:var(--lab-amber);border-color:var(--lab-amber)}
.lab-output{
  padding:12px 14px;
  background:var(--lab-deep);
  border:1px solid var(--lab-border); border-radius:var(--radius);
  min-height:80px; white-space:pre-wrap; overflow-wrap:anywhere;
  color:var(--lab-text); font:11.5px/1.7 var(--font); overflow-x:auto;
}
.label{
  font-size:9px; color:var(--subtle); font-weight:600;
  letter-spacing:.12em; text-transform:uppercase; margin-bottom:5px;
}

/* ============================================================
   PRACTICE, REFERENCES, FOOTER
   ============================================================ */
.practice{
  border:1px solid var(--line); background:var(--panel3);
  border-radius:var(--radius); padding:11px;
}
.practice summary{
  cursor:pointer; font-size:11.5px; font-weight:600; color:var(--text);
  list-style:none; display:flex; align-items:flex-start; gap:8px;
}
.practice summary::-webkit-details-marker{display:none}
.practice summary::before{
  content:"?"; flex:none;
  width:18px;height:18px;
  display:grid;place-items:center;
  border:1px solid var(--line2); border-radius:var(--radius-sm);
  color:var(--accent); font-size:10px; font-weight:600;
}
.practice[open] summary::before{content:"…"}
.practice p{font-size:11.5px;color:var(--muted);margin:9px 0 0;line-height:1.65}

.references{display:flex;flex-direction:column;gap:6px}
.references a{font-size:11.5px;overflow-wrap:anywhere;line-height:1.55}
.references a:hover{text-decoration:underline}

.footer{
  display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap;
  align-items:center; padding:12px 2px 6px;
  font-size:10px; color:var(--subtle);
  border-top:1px solid var(--line); margin-top:20px;
}

/* ============================================================
   HOME
   ============================================================ */
.home-hero{
  padding:26px 26px 24px;
  background:var(--panel); border:1px solid var(--line);
  border-radius:var(--radius-lg); margin-bottom:12px;
}
.home-hero h1{
  font-size:clamp(20px,2.4vw,26px); line-height:1.25;
  letter-spacing:-0.015em; margin:6px 0 10px; font-weight:600;
}
.home-hero p{color:var(--muted);font-size:12.5px;max-width:800px;margin:0 0 14px;line-height:1.65}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:12px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:11px;min-width:0}
.stat strong{display:block;font-size:18px;color:var(--text);font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{display:block;font-size:9.5px;color:var(--subtle);margin-top:4px;letter-spacing:.08em;text-transform:uppercase;font-weight:500}
.chapter-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.chapter-card{
  padding:12px 13px; text-align:left;
  border:1px solid var(--line); border-radius:var(--radius);
  background:var(--panel); color:var(--text);
  transition:border-color .12s,background .12s; min-width:0;
}
.chapter-card:hover{border-color:var(--accent);background:var(--panel2)}
.chapter-card .num{font-size:9px;color:var(--accent);letter-spacing:.1em;font-weight:600;text-transform:uppercase}
.chapter-card strong{display:block;font-size:12px;margin:4px 0;font-weight:600;line-height:1.4}
.chapter-card p{font-size:11px;color:var(--muted);margin:0;line-height:1.55}

/* ============================================================
   TOAST
   ============================================================ */
.toast{
  position:fixed; z-index:99; bottom:18px; left:50%;
  transform:translate(-50%,10px); opacity:0; pointer-events:none;
  background:var(--panel); border:1px solid var(--line2);
  border-radius:var(--radius); padding:9px 14px;
  font-size:11.5px; color:var(--text);
  box-shadow:0 4px 20px rgba(0,0,0,.15);
  transition:opacity .14s, transform .14s;
  max-width:calc(100vw - 32px);
}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media(max-width:1080px){
  .layout{grid-template-columns:220px minmax(0,1fr)}
  main{padding:20px 18px 32px}
}
@media(max-width:840px){
  .topbar{min-height:56px;height:auto;flex-wrap:wrap;gap:9px;padding:9px 12px}
  .top-meta{display:none}
  .top-actions{margin-left:auto;gap:5px}
  .top-actions label{display:none}
  .layout{display:block}
  .sidebar{position:static;height:auto;max-height:none;border-right:0;border-bottom:1px solid var(--line);padding:14px}
  .tree{max-height:280px;overflow:auto}
  .side-foot{margin-top:12px}
  main{padding:18px 15px 32px}
  .idea{grid-template-columns:1fr}
  .mental{order:-1}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .chapter-cards,.two,.lab-cols{grid-template-columns:1fr}
}
@media(max-width:520px){
  .brand{font-size:11.5px;gap:5px}
  .top-actions select{max-width:88px;padding:5px 6px;font-size:10px}
  .top-actions .btn{padding:5px 7px;font-size:10px}
  .chapter-cards,.tiles{grid-template-columns:1fr}
  .home-hero{padding:18px}
  .home-hero h1,.header h1{font-size:20px}
  .body,.panel-head{padding-left:13px;padding-right:13px}
  .footer{display:block}
  .footer span{display:block;margin-bottom:5px}
}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{scroll-behavior:auto!important;transition:none!important;animation:none!important}
}
@media print{
  .topbar,.sidebar,.header-actions,.lab-top,.btn,.toast{display:none!important}
  .layout{display:block}
  main{padding:0;max-width:none}
  .panel,.home-hero{break-inside:avoid;box-shadow:none}
  .pseudo,.lab-output,.lab-input{background:#fff!important;color:#111!important;border-color:#ccc!important}
  body{background:#fff;color:#111}
  a{color:#111;text-decoration:underline}
}
</style>
</head>
<body>
<!-- ===== HEADER ===== -->
<header class="topbar">
  <a class="brand" href="#home" id="homeLink" aria-label="aznur Statistics, Probability and Time Series Lab home">
    <span class="brand-word">aznur</span>
    <span class="brand-divider">/</span>
    <span class="brand-name">stats &amp; ts lab</span>
  </a>
  <div class="top-meta" id="catalogCount"></div>
  <div class="top-actions">
    <label for="themeSelect">Theme</label>
    <select id="themeSelect" aria-label="Theme"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select>
    <button class="btn" id="printBtn" type="button">Print / PDF</button>
    <button class="btn" id="exportBtn" type="button">Export</button>
    <button class="btn" id="importBtn" type="button">Import</button>
    <input type="file" id="importFile" accept="application/json,.json" hidden>
  </div>
</header>

<!-- ===== LAYOUT ===== -->
<div class="layout">
  <aside class="sidebar" aria-label="Course navigation">
    <div class="side-title"><span>COURSE CATALOG</span><span class="pill" id="lessonCount">0</span></div>
    <div class="search"><span aria-hidden="true">⌕</span><input id="searchInput" type="search" placeholder="Search probability, inference, time series…" aria-label="Search lessons"><kbd>/</kbd></div>
    <label class="filter">Chapter<select id="chapterFilter"><option value="all">All chapters</option></select></label>
    <nav class="tree" id="courseTree" aria-label="Lessons"></nav>
    <div class="side-foot">
      <div class="progress-row"><span>COURSE PROGRESS</span><strong id="progressText">0 / 0</strong></div>
      <div class="progress" id="progressBar"><div id="progressFill"></div></div>
      <div class="side-actions"><button class="btn" data-page="home" type="button">Home</button><button class="btn" data-page="progress" type="button">Progress</button></div>
    </div>
  </aside>
  <main id="mainView" tabindex="-1" aria-live="polite"></main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
// ============================================================
// CONFIG / CONSTANTS
// ============================================================
const CHAPTERS = [
  {id:"st-prob", title:"26.1 Probability foundations", desc:"Distributions, expectation, variance, covariance, Bayes' theorem, conditional probability.", ids:["distributions","expectation-variance","bayes"]},
  {id:"st-desc", title:"26.2 Descriptive statistics and resampling", desc:"Robust statistics, quantiles, bootstrap, permutation tests, confidence intervals.", ids:["descriptive-robust","bootstrap-permutation"]},
  {id:"st-test", title:"26.3 Statistical testing", desc:"z-test, t-test, chi-square, Mann-Whitney, ANOVA, multiple-testing correction.", ids:["z-t-test","chi-square-anova","multiple-testing"]},
  {id:"st-bayes", title:"26.4 Bayesian methods", desc:"Priors, likelihoods, posterior inference, conjugate models, MCMC, variational inference.", ids:["bayes-inference","conjugate","mcmc-vi"]},
  {id:"st-reg", title:"26.5 Regression and generalized models", desc:"Linear regression, logistic regression, GLMs, regularization, diagnostics.", ids:["linear-regression","logistic-glm","regularization"]},
  {id:"st-surv", title:"26.6 Survival and event analysis", desc:"Kaplan-Meier, log-rank test, Cox proportional hazards, competing risks.", ids:["kaplan-meier","cox-model","competing-risks"]},

const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = (x, d = 3) => (typeof x === 'number' && isFinite(x)) ? x.toFixed(d) : String(x);
const numbers = s => (s.match(/-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?/g) || []).map(Number);
const mean = a => a.reduce((s, x) => s + x, 0) / a.length;
const variance = a => { const m = mean(a); return a.reduce((s, x) => s + (x - m) ** 2, 0) / (a.length - 1); };
const sd = a => Math.sqrt(variance(a));
const quantile = (a, p) => {
  const s = [...a].sort((x, y) => x - y);
  const h = (s.length - 1) * p, lo = Math.floor(h), hi = Math.ceil(h);
  return s[lo] + (h - lo) * (s[hi] - s[lo]);
};
const median = a => quantile(a, 0.5);
const normCdf = z => {
  const t = 1 / (1 + 0.2316419 * Math.abs(z));
  const d = 0.3989423 * Math.exp(-z * z / 2);
  const p = d * t * (0.3193815 + t * (-0.3565638 + t * (1.781478 + t * (-1.821256 + t * 1.330274))));
  return z >= 0 ? 1 - p : p;
};
const prettyId = id => id.replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase());

const DEMOS = {
  distributions(input) {
    const p = input.trim().split(/\s+/), kind = (p[0] || '').toLowerCase();
    if (kind === 'normal') {
      const mu = +p[1] || 0, s = +p[2] || 1;
      const pdf = x => Math.exp(-((x - mu) ** 2) / (2 * s * s)) / (s * Math.sqrt(2 * Math.PI));
      const peak = pdf(mu);
      let out = `Normal(mu=${mu}, sigma=${s})\n\n`;
      for (let x = mu - 3 * s; x <= mu + 3 * s + 1e-9; x += s / 2) {
        const v = pdf(x);
        out += `x=${fmt(x, 2).padStart(6)}  ${'█'.repeat(Math.round(v / peak * 40))}\n`;
      }
      return out;
    }
    if (kind === 'poisson') {
      const lam = +p[1] || 3;
      const fact = k => { let r = 1; for (let i = 2; i <= k; i++) r *= i; return r; };
      const pmf = k => Math.exp(-lam) * Math.pow(lam, k) / fact(k);
      const peak = pmf(Math.floor(lam));
      let out = `Poisson(lambda=${lam}), mean = variance = ${lam}\n\n`;
      const maxK = Math.ceil(lam * 3) + 3;
      for (let k = 0; k <= maxK; k++)
        out += `k=${k}  ${'█'.repeat(Math.round(pmf(k) / peak * 40))}  ${fmt(pmf(k), 4)}\n`;
      return out;
    }
    if (kind === 'binomial') {
      const n = +p[1] || 10, pr = +p[2] || 0.5;
      const C = (n, k) => { let r = 1; for (let i = 1; i <= k; i++) r = r * (n - i + 1) / i; return r; };
      const pmf = k => C(n, k) * Math.pow(pr, k) * Math.pow(1 - pr, n - k);
      const peak = Math.max(...Array.from({ length: n + 1 }, (_, k) => pmf(k)));
      let out = `Binomial(n=${n}, p=${pr}), mean=${fmt(n * pr, 2)}, var=${fmt(n * pr * (1 - pr), 2)}\n\n`;
      for (let k = 0; k <= n; k++)
        out += `k=${k}  ${'█'.repeat(Math.round(pmf(k) / peak * 40))}  ${fmt(pmf(k), 4)}\n`;
      return out;
    }
    return 'Usage: normal <mu> <sigma> | poisson <lambda> | binomial <n> <p>';
  },
  'expectation-variance'(input) {
    const a = numbers(input);
    if (a.length < 2) return 'Provide at least two numbers.';
    return [
      `n = ${a.length}`,
      `mean = ${fmt(mean(a))}`,
      `variance (n-1) = ${fmt(variance(a))}`,
      `sd = ${fmt(sd(a))}`,
      `min = ${Math.min(...a)}, max = ${Math.max(...a)}`
    ].join('\n');
  },
  bayes(input) {
    const [prior, sens, spec] = numbers(input);
    if (![prior, sens, spec].every(Number.isFinite)) return 'Usage: <prior> <sensitivity> <specificity>';
    const pPos = sens * prior + (1 - spec) * (1 - prior);
    const post = sens * prior / pPos;
    return [
      `P(disease)        = ${fmt(prior, 4)}`,
      `P(+ | disease)    = ${fmt(sens, 4)}`,
      `P(- | healthy)    = ${fmt(spec, 4)}`,
      `P(+)              = ${fmt(pPos, 4)}`,
      `P(disease | +)    = ${fmt(post, 4)}`,
      ``,
      `After a positive test the posterior probability is ${(post * 100).toFixed(2)}%.`
    ].join('\n');
  },
  descriptive(input) {
    const a = numbers(input);
    if (a.length < 2) return 'Provide at least two numbers.';
    const med = median(a), q1 = quantile(a, 0.25), q3 = quantile(a, 0.75);
    const mad = median(a.map(x => Math.abs(x - med)));
    return [
      `n = ${a.length}`,
      `mean = ${fmt(mean(a))}`,
      `median = ${fmt(med)}`,
      `Q1 = ${fmt(q1)}, Q3 = ${fmt(q3)}, IQR = ${fmt(q3 - q1)}`,
      `MAD = ${fmt(mad)}`,
      `robust sd ≈ ${fmt(1.4826 * mad)}`,
      `min = ${Math.min(...a)}, max = ${Math.max(...a)}`
    ].join('\n');
  },
  bootstrap(input) {
    const groups = {};
    input.split('\n').map(l => l.trim()).filter(Boolean).forEach(line => {
      const m = line.match(/^([^:]+):\s*(.+)$/);
      if (m) (groups[m[1].trim()] = groups[m[1].trim()] || []).push(...numbers(m[2]));
      else (groups.data = groups.data || []).push(...numbers(line));
    });
    const data = Object.values(groups).flat();
    if (data.length < 5) return 'Provide at least 5 numbers.';
    const B = 2000, boot = [];
    for (let b = 0; b < B; b++) {
      let s = 0;
      for (let i = 0; i < data.length; i++) s += data[Math.floor(Math.random() * data.length)];
      boot.push(s / data.length);
    }
    boot.sort((x, y) => x - y);
    const lo = boot[Math.floor(0.025 * B)], hi = boot[Math.floor(0.975 * B)];
    return [
      `n = ${data.length}`,
      `observed mean = ${fmt(mean(data))}`,
      `B = ${B} bootstrap resamples`,
      `95% CI = [${fmt(lo)}, ${fmt(hi)}]`
    ].join('\n');
  },
  ttest(input) {
    const lines = input.split('\n').filter(l => l.trim());
    if (lines.length < 2) return 'Provide two lines of numbers (group A and group B).';
    const a = numbers(lines[0]), b = numbers(lines[1]);
    if (a.length < 2 || b.length < 2) return 'Each group needs at least 2 numbers.';
    const ma = mean(a), mb = mean(b), va = variance(a), vb = variance(b);
    const se = Math.sqrt(va / a.length + vb / b.length);
    const t = (ma - mb) / se;
    const p = 2 * (1 - normCdf(Math.abs(t)));
    const df = (va / a.length + vb / b.length) ** 2 /
      ((va / a.length) ** 2 / (a.length - 1) + (vb / b.length) ** 2 / (b.length - 1));
    return [
      `A: n=${a.length}, mean=${fmt(ma)}, sd=${fmt(Math.sqrt(va))}`,
      `B: n=${b.length}, mean=${fmt(mb)}, sd=${fmt(Math.sqrt(vb))}`,
      `Welch t = ${fmt(t)}`,
      `df ≈ ${fmt(df, 1)}`,
      `p (normal approx) = ${fmt(p, 4)}`,
      p < 0.05 ? 'Significant at alpha=0.05.' : 'Not significant at alpha=0.05.'
    ].join('\n');
  },
  'chi-square'(input) {
    const rows = input.split('\n').filter(l => l.trim()).map(numbers).filter(r => r.length >= 2);
    if (rows.length < 2 || rows[0].length < 2) return 'Provide at least a 2×2 table of counts.';
    const R = rows.length, C = rows[0].length;
    const rowSum = rows.map(r => r.reduce((s, x) => s + x, 0));
    const colSum = rows[0].map((_, j) => rows.reduce((s, r) => s + r[j], 0));
    const N = rowSum.reduce((s, x) => s + x, 0);
    let chi = 0;
    for (let i = 0; i < R; i++)
      for (let j = 0; j < C; j++) {
        const e = rowSum[i] * colSum[j] / N;
        if (e > 0) chi += (rows[i][j] - e) ** 2 / e;
      }
    const df = (R - 1) * (C - 1);
    const crit = df * (1 + 2 / (9 * df) + 1.6449 * Math.sqrt(2 / (9 * df))) ** 3;
    return [
      `chi² = ${fmt(chi)}`,
      `df = ${df}`,
      `critical value (alpha=0.05) ≈ ${fmt(crit)}`,
      chi > crit ? 'Reject independence.' : 'Cannot reject independence.'
    ].join('\n');
  },
  'multiple-testing'(input) {
    const p = numbers(input);
    if (p.length < 2) return 'Provide at least two p-values.';
    const m = p.length;
    const sorted = p.slice().sort((a, b) => a - b);
    const bonf = p.filter(x => x < 0.05 / m).length;
    let bhK = 0;
    for (let i = 0; i < m; i++) if (sorted[i] <= (i + 1) / m * 0.05) bhK = i + 1;
    return [
      `m = ${m}, alpha = 0.05`,
      `Bonferroni threshold alpha/m = ${fmt(0.05 / m, 6)}`,
      `Bonferroni rejections: ${bonf}/${m}`,
      `BH rejections (largest k): ${bhK}/${m}`
    ].join('\n');
  },
  'beta-binomial'(input) {
    const [k, n, a, b] = numbers(input);
    if (![k, n, a, b].every(Number.isFinite)) return 'Usage: <successes> <trials> <alpha> <beta>';
    const A = a + k, B = b + n - k;
    const mu = A / (A + B), sig = Math.sqrt(A * B / ((A + B) ** 2 * (A + B + 1)));
    return [
      `prior:     Beta(${a}, ${b})`,
      `data:      ${k} successes in ${n} trials`,
      `posterior: Beta(${A}, ${B})`,
      `posterior mean = ${fmt(mu, 4)}`,
      `posterior sd   = ${fmt(sig, 4)}`,
      `95% CI ≈ [${fmt(mu - 1.96 * sig, 4)}, ${fmt(mu + 1.96 * sig, 4)}]`
    ].join('\n');
  },
  'normal-normal'(input) {
    const obs = input.split('\n').filter(l => l.trim())
      .map(l => l.trim().split(/\s+/).map(Number))
      .filter(p => p.length >= 4 && p.every(Number.isFinite));
    if (!obs.length) return 'Usage per line: <xbar> <sigma> <mu0> <tau>';
    let mu = obs[0][2], tau2 = obs[0][3] ** 2;
    let out = `Prior N(${fmt(mu, 3)}, ${fmt(Math.sqrt(tau2), 3)}^2)\n\n`;
    for (const [xbar, sigma] of obs) {
      const s2 = sigma ** 2;
      const postPrec = 1 / tau2 + 1 / s2;
      mu = (mu / tau2 + xbar / s2) / postPrec;
      tau2 = 1 / postPrec;
      out += `Observe x=${xbar} (sigma=${sigma}) → N(${fmt(mu, 3)}, ${fmt(Math.sqrt(tau2), 3)}^2)\n`;
    }
    return out + `\nPosterior mean = ${fmt(mu, 4)}, sd = ${fmt(Math.sqrt(tau2), 4)}`;
  },
  ols(input) {
    const pairs = input.trim().split('\n').map(l => l.trim().split(/\s+/).map(Number))
      .filter(p => p.length >= 2 && p.every(Number.isFinite));
    if (pairs.length < 2) return 'Provide at least two <x> <y> pairs, one per line.';
    const xs = pairs.map(p => p[0]), ys = pairs.map(p => p[1]);
    const mx = mean(xs), my = mean(ys);
    let sxy = 0, sxx = 0;
    for (let i = 0; i < xs.length; i++) { sxy += (xs[i] - mx) * (ys[i] - my); sxx += (xs[i] - mx) ** 2; }
    const slope = sxy / sxx, intercept = my - slope * mx;
    let ssr = 0, sst = 0;
    for (let i = 0; i < xs.length; i++) {
      const yh = slope * xs[i] + intercept;
      ssr += (ys[i] - yh) ** 2; sst += (ys[i] - my) ** 2;
    }
    return [
      `n = ${xs.length}`,
      `slope = ${fmt(slope)}`,
      `intercept = ${fmt(intercept)}`,
      `R² = ${fmt(1 - ssr / sst, 4)}`,
      `y = ${fmt(slope)} x + ${fmt(intercept)}`
    ].join('\n');
  },
  logistic(input) {
    const pairs = input.trim().split('\n').map(l => l.trim().split(/\s+/).map(Number))
      .filter(p => p.length >= 2 && p.every(Number.isFinite));
    if (pairs.length < 3) return 'Provide at least three <x> <y> pairs with y in {0,1}.';
    let b0 = 0, b1 = 0, lr = 0.5;
    for (let it = 0; it < 3000; it++) {
      let g0 = 0, g1 = 0;
      for (const [x, y] of pairs) {
        const p = 1 / (1 + Math.exp(-(b0 + b1 * x)));
        g0 += (y - p); g1 += (y - p) * x;
      }
      b0 += lr * g0 / pairs.length;
      b1 += lr * g1 / pairs.length;
    }
    return [
      `log-odds = ${fmt(b0)} + ${fmt(b1)} x`,
      `odds ratio per unit x = ${fmt(Math.exp(b1), 4)}`
    ].join('\n');
  },
  ridge(input) {
    const lines = input.trim().split('\n').filter(l => l.trim());
    const lam = +lines[0];
    const pairs = lines.slice(1).map(l => l.trim().split(/\s+/).map(Number))
      .filter(p => p.length >= 2 && p.every(Number.isFinite));
    if (!Number.isFinite(lam) || pairs.length < 2) return 'First line: lambda. Then <x> <y> pairs.';
    const xs = pairs.map(p => p[0]), ys = pairs.map(p => p[1]);
    const mx = mean(xs), my = mean(ys);
    let sxy = 0, sxx = 0;
    for (let i = 0; i < xs.length; i++) { sxy += (xs[i] - mx) * (ys[i] - my); sxx += (xs[i] - mx) ** 2; }
    const olsSlope = sxy / sxx;
    const slope = sxy / (sxx + lam);
    const intercept = my - slope * mx;
    return [
      `lambda = ${lam}`,
      `ridge slope = ${fmt(slope)}`,
      `intercept   = ${fmt(intercept)}`,
      `(OLS slope for comparison: ${fmt(olsSlope)})`
    ].join('\n');
  },
  'kaplan-meier'(input) {
    const pairs = input.trim().split('\n').map(l => l.trim().split(/\s+/).map(Number))
      .filter(p => p.length >= 2 && p.every(Number.isFinite));
    if (!pairs.length) return 'Provide <time> <event> pairs, one per line.';
    pairs.sort((a, b) => a[0] - b[0]);
    let S = 1, atRisk = pairs.length;
    const out = ['t   n_risk  d    S(t)'];
    for (const [t, d] of pairs) {
      if (d === 1) { S *= 1 - 1 / atRisk; out.push(`${String(t).padStart(3)}   ${String(atRisk).padStart(5)}  ${d}   ${fmt(S, 4)}`); }
      else out.push(`${String(t).padStart(3)}   ${String(atRisk).padStart(5)}  ${d}   ${fmt(S, 4)} (censored)`);
      atRisk--;
    }
    return out.join('\n');
  },
  acf(input) {
    const a = numbers(input);
    if (a.length < 4) return 'Provide at least four numbers.';
    const m = mean(a);
    const denom = a.reduce((s, x) => s + (x - m) ** 2, 0);
    const maxLag = Math.min(10, Math.floor(a.length / 2));
    let out = '';
    for (let k = 0; k <= maxLag; k++) {
      let num = 0;
      for (let i = 0; i < a.length - k; i++) num += (a[i] - m) * (a[i + k] - m);
      const rho = num / denom;
      out += `lag ${String(k).padStart(2)}   ${'█'.repeat(Math.round(Math.abs(rho) * 40))} ${fmt(rho, 4)}\n`;
    }
    return out;
  }
};

function runDemo(lesson, input) {
  const fn = DEMOS[lesson.demo];
  if (!fn) return 'This demo is not available in this build. Study the pseudo-code above.\n\nSample input:\n' + (lesson.sample || '(none)');
  try { return fn(input); } catch (e) { return 'Demo error: ' + e.message; }
}

// ============================================================
// RENDER
// ============================================================
function renderTree() {
  const q = els.search.value.toLowerCase().trim();
  const ch = els.filter.value;
  let html = '';
  for (const c of CHAPTERS) {
    if (ch !== 'all' && c.id !== ch) continue;
    const items = c.ids.filter(id => {
      const l = byId(id);
      if (!q) return true;
      if (!l) return prettyId(id).toLowerCase().includes(q);
      return l.title.toLowerCase().includes(q) || (l.summary || '').toLowerCase().includes(q);
    });
    if (!items.length) continue;
    html += `<div><div class="group-label"><span>${esc(c.title)}</span></div>`;
    for (const id of items) {
      const l = byId(id);
      const title = l ? l.title : prettyId(id) + ' (not yet available)';
      const done = state.done.has(id);
      const active = state.page === 'lesson' && state.lesson === id;
      const num = String(ALL_IDS.indexOf(id) + 1).padStart(2, '0');
      html += `<button class="link ${active ? 'active' : ''}" data-lesson="${esc(id)}" type="button">
        <span class="num">${num}</span>
        <span class="name">${esc(title)}</span>
        ${done ? '<span class="done">✓</span>' : ''}
      </button>`;
    }
    html += '</div>';
  }
  els.tree.innerHTML = html;
  els.count.textContent = ALL_IDS.length;
  els.catalog.textContent = `${CHAPTERS.length} chapters · ${ALL_IDS.length} lessons`;
  if (els.filter.options.length <= 1) {
    CHAPTERS.forEach(c => {
      const o = document.createElement('option');
      o.value = c.id; o.textContent = c.title;
      els.filter.appendChild(o);
    });
  }
}

function renderProgress() {
  const total = ALL_IDS.length, done = state.done.size;
  els.progressText.textContent = `${done} / ${total}`;
  els.progressFill.style.width = (total ? (done / total * 100) : 0) + '%';
}

function renderHome() {
  const total = ALL_IDS.length, done = state.done.size;
  let html = `
  <div class="home-hero">
    <div class="eyebrow">Az · Statistics, Probability &amp; Time Series Lab</div>
    <h1>Probability, inference and time series, made concrete.</h1>
    <p>${total} lessons across ${CHAPTERS.length} chapters. Every concept comes with pseudo-code, a small interactive demo and a walk-through. Progress is saved in this browser.</p>
  </div>
  <div class="stats">
    <div class="stat"><strong>${total}</strong><span>Lessons</span></div>
    <div class="stat"><strong>${CHAPTERS.length}</strong><span>Chapters</span></div>
    <div class="stat"><strong>${done}</strong><span>Completed</span></div>
    <div class="stat"><strong>${total - done}</strong><span>Remaining</span></div>
  </div>
  <div class="chapter-cards">`;
  CHAPTERS.forEach((c, i) => {
    const n = (c.title.match(/^\d+\.\d+/) || [String(i + 1)])[0];
    const cleanTitle = c.title.replace(/^\d+\.\d+\s*/, '');
    html += `<button class="chapter-card" data-chapter="${esc(c.id)}" type="button">
      <span class="num">Chapter ${n}</span>
      <strong>${esc(cleanTitle)}</strong>
      <p>${esc(c.desc)}</p>
    </button>`;
  });
  html += '</div>';
  els.main.innerHTML = html;
}

function renderLesson(id) {
  const l = byId(id);
  const ch = CHAPTERS.find(c => c.ids.includes(id));
  const num = ALL_IDS.indexOf(id) + 1;
  if (!l) {
    els.main.innerHTML = `
      <div class="breadcrumb">${esc(ch ? ch.title : 'Lesson')} / ${String(num).padStart(2, '0')}</div>
      <div class="header">
        <div class="eyebrow">Not available</div>
        <h1>${esc(prettyId(id))}</h1>
        <p>This lesson is not included in this build. The course catalog lists it as coming soon.</p>
        <div class="header-actions"><button class="btn" id="backBtn" type="button">← Back home</button></div>
      </div>`;
    $('backBtn').addEventListener('click', () => gotoPage('home'));
    return;
  }
  const done = state.done.has(id);
  const statusTag = l.status === 'Runnable teaching lab'
    ? '<span class="tag good">Runnable teaching lab</span>'
    : `<span class="tag">${esc(l.status || 'Concept')}</span>`;
  const refsHtml = (l.refs && l.refs.length) ? `
    <section class="panel">
      <div class="panel-head"><h2>References</h2></div>
      <div class="body">
        <div class="references">${l.refs.map(([t, u]) => `<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(t)}</a>`).join('')}</div>
      </div>
    </section>` : '';
  const demoHtml = (l.demo && l.demo !== 'none') ? `
    <section class="panel">
      <div class="panel-head"><h2>Interactive lab</h2><p>Edit the input and click Run.</p></div>
      <div class="body">
        <label class="label" for="demoInput">Input</label>
        <textarea id="demoInput" class="lab-input" spellcheck="false" aria-label="Demo input">${esc(l.sample || '')}</textarea>
        <div class="lab-top">
          <button class="btn primary" id="runBtn" type="button">Run</button>
          <button class="btn" id="resetBtn" type="button">Reset</button>
        </div>
        <div class="label" style="margin-top:12px">Output</div>
        <div class="lab-output" id="demoOut" aria-live="polite">Click Run to execute.</div>
      </div>
    </section>` : '';

  els.main.innerHTML = `
  <div class="breadcrumb">${esc(ch ? ch.title : 'Lesson')} / ${String(num).padStart(2, '0')}</div>
  <div class="header">
    <div class="eyebrow">Lesson ${String(num).padStart(2, '0')} · ${esc(l.kind)}</div>
    <h1>${esc(l.title)}</h1>
    <p>${esc(l.summary)}</p>
    <div class="tags">${statusTag}<span class="tag">Level ${l.level}/5</span><span class="tag">${esc(l.kind)}</span></div>
    <div class="header-actions">
      <button class="btn primary" id="markBtn" type="button">${done ? 'Mark as not done' : 'Mark as done'}</button>
      <button class="btn" id="nextBtn" type="button">Next lesson →</button>
    </div>
  </div>

  <section class="panel">
    <div class="panel-head"><h2>Core idea</h2><p>${esc(l.problem)}</p></div>
    <div class="body">
      <div class="idea">
        <div>
          <p>${esc(l.summary)}</p>
          <div class="takeaway"><strong>Invariant:</strong> ${esc(l.invariant)}</div>
        </div>
        <div class="mental">
          <small>Mental model</small>
          <strong>${esc(l.mental)}</strong>
          <p>${esc(l.mentalText)}</p>
        </div>
      </div>
    </div>
  </section>

  <section class="panel">
    <div class="panel-head"><h2>Steps</h2></div>
    <div class="body"><ol class="steps">${l.steps.map(s => `<li>${esc(s)}</li>`).join('')}</ol></div>
  </section>

  <section class="panel">
    <div class="panel-head"><h2>Reference pseudo-code</h2></div>
    <div class="body"><pre class="pseudo">${esc(l.pseudo)}</pre></div>
  </section>

  ${demoHtml}

  <section class="panel">
    <div class="panel-head"><h2>When to use it</h2></div>
    <div class="body">
      <div class="two">
        <div class="mini"><h3>Strengths</h3><p>${esc(l.strength)}</p></div>
        <div class="mini"><h3>Limits</h3><p>${esc(l.limits)}</p></div>
      </div>
      <div class="takeaway" style="margin-top:10px"><strong>Pitfall:</strong> ${esc(l.pitfall)}</div>
    </div>
  </section>

  <section class="panel">
    <div class="panel-head"><h2>Check your understanding</h2></div>
    <div class="body">
      <details class="practice"><summary>${esc(l.question)}</summary><p>${esc(l.answer)}</p></details>
    </div>
  </section>

  ${refsHtml}`;

  $('markBtn').addEventListener('click', () => {
    if (state.done.has(id)) state.done.delete(id); else state.done.add(id);
    saveProgress(); renderTree(); renderProgress(); renderLesson(id);
  });
  $('nextBtn').addEventListener('click', () => {
    const i = ALL_IDS.indexOf(id);
    if (i < ALL_IDS.length - 1) gotoLesson(ALL_IDS[i + 1]); else toast('Last lesson reached.');
  });
  const runBtn = $('runBtn'), resetBtn = $('resetBtn');
  if (runBtn) runBtn.addEventListener('click', () => {
    $('demoOut').textContent = runDemo(l, $('demoInput').value);
  });
  if (resetBtn) resetBtn.addEventListener('click', () => {
    $('demoInput').value = l.sample || '';
    $('demoOut').textContent = 'Click Run to execute.';
  });
}

function renderProgressPage() {
  const total = ALL_IDS.length, done = state.done.size;
  let html = `<div class="header"><div class="eyebrow">Progress</div><h1>Your progress</h1><p>${done} of ${total} lessons completed.</p></div>
    <section class="panel"><div class="body">`;
  CHAPTERS.forEach(c => {
    const cdone = c.ids.filter(id => state.done.has(id)).length;
    html += `<div style="margin-bottom:10px">
      <div class="progress-row"><span>${esc(c.title)}</span><strong>${cdone}/${c.ids.length}</strong></div>
      <div class="progress"><div style="width:${c.ids.length ? cdone / c.ids.length * 100 : 0}%"></div></div>
    </div>`;
  });
  html += `</div></section>`;
  els.main.innerHTML = html;
}

function render() {
  renderTree();
  renderProgress();
  if (state.page === 'home') renderHome();
  else if (state.page === 'progress') renderProgressPage();
  else if (state.page === 'lesson') renderLesson(state.lesson);
}

function syncHash() {
  if (state.page === 'lesson') history.replaceState(null, '', '#lesson/' + state.lesson);
  else if (state.page === 'progress') history.replaceState(null, '', '#progress');
  else history.replaceState(null, '', '#home');
}

function gotoLesson(id) {
  state.page = 'lesson';
  state.lesson = id;
  render();
  syncHash();
  window.scrollTo({ top: 0, behavior: 'smooth' });
  els.main.focus({ preventScroll: true });
}

function gotoPage(p) {
  state.page = p;
  state.lesson = null;
  render();
  syncHash();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ============================================================
function bind() {
  els.search.addEventListener('input', renderTree);
  els.filter.addEventListener('change', renderTree);
  els.tree.addEventListener('click', e => {
    const b = e.target.closest('[data-lesson]');
    if (b) gotoLesson(b.dataset.lesson);
  });
  els.main.addEventListener('click', e => {
    const b = e.target.closest('[data-lesson]');
    if (b) return gotoLesson(b.dataset.lesson);
    const c = e.target.closest('[data-chapter]');
    if (c) {
      const ch = CHAPTERS.find(x => x.id === c.dataset.chapter);
      if (ch) { els.filter.value = ch.id; renderTree(); gotoLesson(ch.ids[0]); }
    }
  });
  document.querySelectorAll('[data-page]').forEach(b =>
    b.addEventListener('click', () => gotoPage(b.dataset.page)));
  $('homeLink').addEventListener('click', e => { e.preventDefault(); gotoPage('home'); });

  // theme
  const applyTheme = v => {
    const root = document.documentElement;
    if (v === 'system') {
      const dark = matchMedia('(prefers-color-scheme: dark)').matches;
      root.setAttribute('data-theme', dark ? 'dark' : 'light');
    } else root.setAttribute('data-theme', v);
  };
  applyTheme(els.theme.value);
  els.theme.addEventListener('change', () => applyTheme(els.theme.value));
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
    if (els.theme.value === 'system') applyTheme('system');
  });

  // export / import / print
  $('printBtn').addEventListener('click', () => window.print());
  $('exportBtn').addEventListener('click', () => {
    const blob = new Blob([JSON.stringify({ done: [...state.done], version: 1 }, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'az-stats-progress.json';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    toast('Progress exported.');
  });
  $('importBtn').addEventListener('click', () => $('importFile').click());
  $('importFile').addEventListener('change', e => {
    const f = e.target.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const d = JSON.parse(r.result);
        if (Array.isArray(d.done)) {
          state.done = new Set(d.done.filter(x => VALID_IDS.has(x)));
          saveProgress(); render();
          toast('Progress imported.');
        } else toast('Import failed: no "done" array.');
      } catch { toast('Import failed: invalid JSON.'); }
    };
    r.readAsText(f);
    e.target.value = '';
  });

  // keyboard shortcut
  document.addEventListener('keydown', e => {
    const tag = document.activeElement.tagName;
    if (e.key === '/' && tag !== 'INPUT' && tag !== 'TEXTAREA') {
      e.preventDefault(); els.search.focus();
    }
  });
}

// ============================================================
// INIT
// ============================================================
(function init() {
  const h = location.hash.replace(/^#/, '');
  if (h.startsWith('lesson/')) {
    const id = h.slice(7);
    if (VALID_IDS.has(id)) { state.page = 'lesson'; state.lesson = id; }
  } else if (h === 'progress') state.page = 'progress';

  bind();
  render();
})();
</script>
</body>
</html>
