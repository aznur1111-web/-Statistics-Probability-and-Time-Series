/* 26.6 Kaplan-Meier */
function demoKaplanMeier(text){
 const lines=text.trim().split(/\n/).filter(Boolean);
 const data=lines.map(l=>{const p=l.split(/[\s,]+/).filter(Boolean).map(Number);return {t:p[0],e:p[1]||0}});
 if(!data.length)throw Error('Enter lines: time event (1=event, 0=censored).');
 const times=[...new Set(data.map(d=>d.t))].sort((a,b)=>a-b);
 let S=1;
 const curve=[[0,1]];
 const table=[];
 for(const t of times){
  const atRisk=data.filter(d=>d.t>=t).length;
  const events=data.filter(d=>d.t===t&&d.e===1).length;
  if(events>0){
   S*=(1-events/atRisk);
   curve.push([t,S]);
   table.push(`t=${t}: n=${atRisk}, d=${events}, S=${fmtNum(S,4)}`);
  } else {
   curve.push([t,S]);
  }
 }
 return {
  html:linePlotSVG([{label:'Kaplan-Meier S(t)',points:curve}],{height:240}),
  encoded:`Data: ${data.length} observations\n\nSurvival table:\n${table.join('\n')}\n\nMedian survival: ${(()=>{
   const idx=curve.findIndex(p=>p[1]<=0.5);
   return idx>=0?curve[idx][0]:'not reached';
  })()}`,
  decoded:`Kaplan-Meier estimates the survival function step by step. At each event time, multiply by (1 - d/n). Censored observations leave the risk set without an event.`
 };
}

/* 26.6 competing risks */
function demoCompetingRisks(text){
 const lines=text.trim().split(/\n/).filter(Boolean);
 const data=lines.map(l=>{const p=l.split(/[\s,]+/).filter(Boolean).map(Number);return {t:p[0],e:p[1]||0}});
 if(!data.length)throw Error('Enter lines: time event (1, 2, ... or 0 for censored).');
 const causes=[...new Set(data.filter(d=>d.e>0).map(d=>d.e))].sort();
 const times=[...new Set(data.map(d=>d.t))].sort((a,b)=>a-b);
 const curves={};
 for(const c of causes){
  let S=1,cif=0;
  curves[c]=[[0,0]];
  for(const t of times){
   const atRisk=data.filter(d=>d.t>=t).length;
   const eventsAll=data.filter(d=>d.t===t&&d.e>0).length;
   const eventsC=data.filter(d=>d.t===t&&d.e===c).length;
   if(eventsAll>0){
    cif+=S*eventsC/atRisk;
    S*=(1-eventsAll/atRisk);
    curves[c].push([t,cif]);
   } else {
    curves[c].push([t,cif]);
   }
  }
 }
 const series=causes.map(c=>({label:`Cause ${c}`,points:curves[c]}));
 let out=`Competing events: ${causes.join(', ')}\nObservations: ${data.length}\n\n`;
 for(const c of causes){
  const last=curves[c][curves[c].length-1];
  out+=`CIF for cause ${c} at last time: ${fmtNum(last[1],4)}\n`;
 }
 return {
  html:linePlotSVG(series,{height:240}),
  encoded:out,
  decoded:`The cumulative incidence function (CIF) gives the probability of each event type over time, accounting for the competing events. It is not the same as 1 - Kaplan-Meier.`
 };
}

/* 26.7 ACF */
function demoAcf(text){
 const x=parseNums(text);
 if(x.length<5)throw Error('Enter at least 5 numbers.');
 const n=x.length;
 const m=mean(x);
 const c0=x.reduce((s,v)=>s+(v-m)**2,0)/n;
 const maxLag=Math.min(15,n-1);
 const acf=[];
 const pacf=[];
 for(let k=0;k<=maxLag;k++){
  let s=0;
  for(let t=0;t<n-k;t++)s+=(x[t]-m)*(x[t+k]-m);
  acf.push(s/(n*c0));
 }
 // PACF via Durbin-Levinson
 const pacfArr=[1];
 for(let k=1;k<=maxLag;k++){
  // Solve Yule-Walker for phi_kk
  const R=acf.slice(0,k);
  // Levinson recursion
  let phi=[[]];
  let v=acf[0];
  phi[0]=[1];
  for(let m_=1;m_<=k;m_++){
   const num=R[m_]-sum(phi[m_-1].slice(1).map((p,i)=>p*R[m_-1-i]));
   const kk=num/v;
   const newPhi=[1];
   for(let i=1;i<m_;i++)newPhi.push(phi[m_-1][i]-kk*phi[m_-1][m_-i]);
   newPhi.push(kk);
   phi[m_]=newPhi;
   v*=1-kk*kk;
  }
  pacfArr.push(phi[k][k]);
 }
 function sum(a){return a.reduce((x,y)=>x+y,0)}
 const acfPts=acf.map((v,i)=>[i,v]);
 const pacfPts=pacfArr.map((v,i)=>[i,v]);
 return {
  html:linePlotSVG([
   {label:'ACF',points:acfPts,dots:true,color:'var(--accent)'},
   {label:'PACF',points:pacfPts,dots:true,color:'var(--good)'}
  ],{height:240}),
  encoded:`n = ${n}\n\nACF (lags 0..${maxLag}):\n  ${acf.map(v=>fmtNum(v,3)).join(', ')}\n\nPACF (lags 0..${maxLag}):\n  ${pacfArr.map(v=>fmtNum(v,3)).join(', ')}\n\nApproximate 95% band: ±${fmtNum(1.96/Math.sqrt(n),3)}`,
  decoded:`The ACF measures correlation with lagged values. The PACF measures the direct correlation at each lag. Use both to identify AR and MA orders.`
 };
}

/* 26.7 decomposition */
function demoDecomposition(text){
 const x=parseNums(text);
 if(x.length<8)throw Error('Enter at least 8 numbers.');
 const m=4;
 // Centered moving average
 const half=m/2;
 const trend=new Array(x.length).fill(null);
 for(let t=half;t<x.length-half;t++){
  trend[t]=(0.5*x[t-half]+sum(x.slice(t-half+1,t+half))+0.5*x[t+half])/m;
 }
 // Detrend
 const seasonal=new Array(m).fill(0);
 const counts=new Array(m).fill(0);
 for(let t=0;t<x.length;t++){
  if(trend[t]!==null){
   seasonal[t%m]+=x[t]-trend[t];
   counts[t%m]++;
  }
 }
 for(let i=0;i<m;i++)seasonal[i]/=counts[i]||1;
 const smean=sum(seasonal)/m;
 for(let i=0;i<m;i++)seasonal[i]-=smean;
 // Residuals
 const resid=new Array(x.length).fill(null);
 for(let t=0;t<x.length;t++){
  if(trend[t]!==null)resid[t]=x[t]-trend[t]-seasonal[t%m];
 }
 function sum(a){return a.reduce((x,y)=>x+y,0)}
 return {
  html:linePlotSVG([
   {label:'Original',points:x.map((v,i)=>[i,v])},
   {label:'Trend',points:trend.map((v,i)=>[i,v]).filter(p=>p[1]!==null),color:'var(--good)'}
  ],{height:240}),
  encoded:`n = ${x.length}\nSeasonal period m = ${m}\n\nTrend (centered MA):\n  ${trend.map(v=>v!==null?fmtNum(v,2):'--').join(', ')}\n\nSeasonal indices:\n  ${seasonal.map(v=>fmtNum(v,3)).join(', ')}\nSum: ${fmtNum(sum(seasonal),4)}\n\nResiduals:\n  ${resid.map(v=>v!==null?fmtNum(v,2):'--').join(', ')}`,
  decoded:`Additive decomposition: x_t = trend_t + season_t + residual_t. The trend is a centered moving average. Seasonal indices are the average detrended value per season, normalized to sum to zero.`
 };
}

/* 26.7 SES/Holt */
function demoSesHolt(text){
 const lines=text.trim().split(/\n/).filter(Boolean);
 if(lines.length<2)throw Error('Enter: alpha beta on the first line, then the series.');
 const params=lines[0].split(/[\s,]+/).filter(Boolean).map(Number);
 const alpha=params[0]||0.5,beta=params[1]||0.3;
 const x=parseNums(lines[1]);
 if(x.length<3)throw Error('Series needs at least 3 points.');
 // SES
 let level=x[0];
 const sesF=[level];
 for(let t=1;t<x.length;t++){level=alpha*x[t]+(1-alpha)*level;sesF.push(level)}
 // Holt
 let l=x[0],b=x[1]-x[0];
 const holtF=[l];
 for(let t=1;t<x.length;t++){
  const prev=l;
  l=alpha*x[t]+(1-alpha)*(l+b);
  b=beta*(l-prev)+(1-beta)*b;
  holtF.push(l+b);
 }
 return {
  html:linePlotSVG([
   {label:'Data',points:x.map((v,i)=>[i,v]),dots:true,color:'var(--accent)'},
   {label:'SES',points:sesF.map((v,i)=>[i,v]),color:'var(--good)'},
   {label:'Holt',points:holtF.map((v,i)=>[i,v]),color:'var(--warn)'}
  ],{height:240}),
  encoded:`alpha = ${alpha}, beta = ${beta}\n\nSES final level: ${fmtNum(sesF[sesF.length-1],4)}\nHolt final level + trend: ${fmtNum(holtF[holtF.length-1],4)}\n\nForecast (next 3 periods):\n  SES (flat): ${[1,2,3].map(h=>fmtNum(sesF[sesF.length-1],3)).join(', ')}\n  Holt: ${[1,2,3].map(h=>fmtNum(l+h*b,3)).join(', ')}`,
  decoded:`SES follows the level. Holt adds a trend. Larger alpha reacts faster to the data. Holt's forecast extrapolates the current trend.`
 };
}

/* 26.7 Holt-Winters */
function demoHoltWinters(text){
 const lines=text.trim().split(/\n/).filter(Boolean);
 if(lines.length<2)throw Error('Enter: m alpha beta gamma on the first line, then the series.');
 const params=lines[0].split(/[\s,]+/).filter(Boolean).map(Number);
 const m=Math.max(2,parseInt(params[0]||4));
 const alpha=params[1]||0.3,beta=params[2]||0.1,gamma=params[3]||0.2;
 const x=parseNums(lines[1]);
 if(x.length<2*m)throw Error('Need at least 2 full seasons ('+(2*m)+' points).');
 // Initialize
 let level=mean(x.slice(0,m));
 let trend=(mean(x.slice(m,2*m))-mean(x.slice(0,m)))/m;
 const seasonals=[];
 for(let i=0;i<m;i++)seasonals.push(x[i]-level);
 const fitted=[];
 for(let t=0;t<x.length;t++){
  if(t>=m){
   const s=seasonals[t%m];
   const f=level+trend+s;
   fitted.push({t,f:null,pred:f});
   const prev=level;
   level=alpha*(x[t]-s)+(1-alpha)*(level+trend);
   trend=beta*(level-prev)+(1-beta)*trend;
   seasonals[t%m]=gamma*(x[t]-level)+(1-gamma)*s;
  } else {
   fitted.push({t,f:null,pred:null});
  }
 }
 // Forecast next m
 const fc=[];
 for(let h=1;h<=m;h++){
  fc.push(level+h*trend+seasonals[(x.length+h-1)%m]);
 }
 return {
  html:linePlotSVG([
   {label:'Data',points:x.map((v,i)=>[i,v]),dots:true,color:'var(--accent)'},
   {label:'Fitted',points:fitted.filter(f=>f.pred!==null).map(f=>[f.t,f.pred]),color:'var(--good)'}
  ],{height:240}),
  encoded:`m = ${m}, alpha = ${alpha}, beta = ${beta}, gamma = ${gamma}\nFinal level: ${fmtNum(level,4)}\nFinal trend: ${fmtNum(trend,4)}\nSeasonal indices: [${seasonals.map(v=>fmtNum(v,3)).join(', ')}]\n\nForecast next ${m} periods:\n  [${fc.map(v=>fmtNum(v,3)).join(', ')}]`,
  decoded:`Holt-Winters adds a seasonal component. The seasonal index repeats every m periods. The forecast combines level, trend and the appropriate seasonal index.`
 };
}

/* 26.8 AR(1) */
function demoAr1(text){
 const lines=text.trim().split(/\n/).filter(Boolean);
 if(!lines.length)throw Error('Enter the series.');
 let x;
 if(lines.length>=2){
  const params=lines[0].split(/[\s,]+/).filter(Boolean).map(Number);
  x=parseNums(lines[1]);
 } else {
  x=parseNums(lines[0]);
 }
 if(x.length<5)throw Error('Need at least 5 points.');
 // Fit AR(1)
 const m=mean(x);
 let num=0,den=0;
 for(let t=1;t<x.length;t++){num+=(x[t]-m)*(x[t-1]-m);den+=(x[t-1]-m)**2}
 const phi=num/den;
 // Residual variance
 let ss=0;
 for(let t=1;t<x.length;t++){
  const pred=m+phi*(x[t-1]-m);
  ss+=(x[t]-pred)**2;
 }
 const sigma2=ss/(x.length-1);
 // Forecast
 const h=5;
 const fc=[];
 let last=x[x.length-1]-m;
 for(let k=1;k<=h;k++)fc.push(m+Math.pow(phi,k)*last);
 return {
  html:linePlotSVG([
   {label:'Data',points:x.map((v,i)=>[i,v]),dots:true,color:'var(--accent)'},
   {label:'Forecast',points:fc.map((v,i)=>[x.length-1+i+1,v]),color:'var(--good)'}
  ],{height:240}),
  encoded:`n = ${x.length}\nFitted AR(1): x_t = ${fmtNum(m,4)} + ${fmtNum(phi,4)} (x_{t-1} - ${fmtNum(m,4)}) + e_t\nResidual variance: ${fmtNum(sigma2,4)}\n\n${Math.abs(phi)<1?'Stationary (|phi| < 1)':'Non-stationary (|phi| >= 1)'}\n\nForecast next 5:\n  [${fc.map(v=>fmtNum(v,4)).join(', ')}]`,
  decoded:`AR(1) models the series as a function of its previous value. The forecast decays toward the mean at rate phi. Stationarity requires |phi| < 1.`
 };
}

/* 26.8 ARIMA */
function demoArima(text){
 const lines=text.trim().split(/\n/).filter(Boolean);
 if(lines.length<2)throw Error('Enter: p d q on the first line, then the series.');
 const params=lines[0].split(/[\s,]+/).filter(Boolean).map(Number);
 const p=params[0]||1,d=params[1]||1,q=params[2]||0;
 const x=parseNums(lines[1]);
 if(x.length<6)throw Error('Need at least 6 points.');
 // Difference d times
 let y=[...x];
 for(let i=0;i<d;i++){y=y.slice(1).map((v,j)=>v-y[j])}
 // Fit AR(p) by OLS on lagged values
 const n=y.length;
 const m=mean(y);
 let num=0,den=0;
 for(let t=1;t<n;t++){num+=(y[t]-m)*(y[t-1]-m);den+=(y[t-1]-m)**2}
 const phi=num/den||0;
 // Forecast on differenced series
 const h=4;
 const yLast=y[n-1];
 const fcDiff=[];
 let cur=yLast;
 for(let k=0;k<h;k++){cur=m+phi*(cur-m);fcDiff.push(cur)}
 // Integrate back
 const fc=[];
 let last=x[x.length-1];
 if(d===1){
  let s=last;
  for(const dv of fcDiff){s+=dv;fc.push(s)}
 }
 return {
  html:linePlotSVG([
   {label:'Data',points:x.map((v,i)=>[i,v]),dots:true,color:'var(--accent)'},
   {label:'Forecast',points:fc.map((v,i)=>[x.length+i,v]),color:'var(--good)'}
  ],{height:240}),
  encoded:`ARIMA(${p}, ${d}, ${q}) (simplified AR-only fit)\nn = ${x.length}\nDifferenced length: ${n}\nFitted AR(1) on differenced series: phi = ${fmtNum(phi,4)}, mean = ${fmtNum(m,4)}\n\nForecast next ${h}:\n  [${fc.map(v=>fmtNum(v,4)).join(', ')}]`,
  decoded:`ARIMA differences the series d times, fits an ARMA model, then integrates the forecast back to the original scale. This simplified lab fits an AR(1) on the differenced series.`
 };
}

/* 26.8 state-space / Kalman */
function demoStateSpace(text){
 const obs=parseNums(text);
 if(obs.length<4)throw Error('Enter at least 4 numbers.');
 const processVar=1,obsVar=1;
 let x=obs[0],p=1;
 const filtered=[];
 for(const y of obs){
  const pPred=p+processVar;
  const k=pPred/(pPred+obsVar);
  x=x+k*(y-x);
  p=(1-k)*pPred;
  filtered.push(x);
 }
 return {
  html:linePlotSVG([
   {label:'Observations',points:obs.map((v,i)=>[i,v]),dots:true,color:'var(--accent)'},
   {label:'Kalman filter',points:filtered.map((v,i)=>[i,v]),color:'var(--good)'}
  ],{height:240}),
  encoded:`n = ${obs.length}\nProcess variance Q = ${processVar}\nObservation variance R = ${obsVar}\n\nFinal filtered state: ${fmtNum(filtered[filtered.length-1],4)}\n\nFiltered series:\n  ${filtered.map(v=>fmtNum(v,3)).join(', ')}`,
  decoded:`The Kalman filter predicts the next state, then corrects with the observation. The gain K balances trust in the model vs trust in the data. Larger R means noisier observations, so the filter relies more on the model.`
 };
}

/* 26.9 z-score/EWMA */
function demoZscoreEwma(text){
 const lines=text.trim().split(/\n/).filter(Boolean);
 if(lines.length<2)throw Error('Enter: lambda on the first line, then the series.');
 const lam=Math.max(0.01,Math.min(0.99,parseFloat(lines[0])||0.3));
 const x=parseNums(lines[1]);
 if(x.length<5)throw Error('Need at least 5 points.');
 let m=x[0],v=0;
 const zs=[];
 const flags=[];
 for(let t=1;t<x.length;t++){
  const z=(x[t]-m)/(Math.sqrt(v)+1e-9);
  zs.push({t,z});
  if(Math.abs(z)>3)flags.push(t);
  m=lam*x[t]+(1-lam)*m;
  v=lam*(x[t]-m)**2+(1-lam)*v;
 }
 return {
  html:linePlotSVG([
   {label:'Series',points:x.map((v,i)=>[i,v]),dots:true,color:'var(--accent)'},
   {label:'EWMA mean',points:zs.map((z,i)=>[i+1,m])}
  ],{height:240}),
  encoded:`Lambda = ${lam}\nn = ${x.length}\n\nz-scores (EWMA):\n  ${zs.map(z=>fmtNum(z.z,2)).join(', ')}\n\nFlagged points (|z| > 3): ${flags.length?flags.join(', '):'(none)'}`,
  decoded:`The EWMA z-score compares each observation to the running mean and variance. Points beyond 3 standard deviations are flagged as anomalies.`
 };
}

/* 26.9 CUSUM */
function demoCusum(text){
 const lines=text.trim().split(/\n/).filter(Boolean);
 if(lines.length<2)throw Error('Enter: k h on the first line, then the series.');
 const params=lines[0].split(/[\s,]+/).filter(Boolean).map(Number);
 const k=params[0]||0.5,h=params[1]||5;
 const x=parseNums(lines[1]);
 if(x.length<5)throw Error('Need at least 5 points.');
 const target=mean(x.slice(0,Math.min(10,x.length)));
 let sHigh=0,sLow=0;
 const high=[],low=[],flags=[];
 for(let i=0;i<x.length;i++){
  sHigh=Math.max(0,sHigh+(x[i]-target)-k);
  sLow=Math.max(0,sLow-(x[i]-target)-k);
  high.push(sHigh);low.push(sLow);
  if(sHigh>h||sLow>h)flags.push(i);
 }
 return {
  html:linePlotSVG([
   {label:'Upper CUSUM',points:high.map((v,i)=>[i,v]),color:'var(--accent)'},
   {label:'Lower CUSUM',points:low.map((v,i)=>[i,v]),color:'var(--good)'},
   {label:'Threshold h',points:[[0,h],[x.length-1,h]],color:'var(--warn)'}
  ],{height:240}),
  encoded:`Target mean (baseline): ${fmtNum(target,4)}\nk = ${k}, h = ${h}\n\nSignals at indices: ${flags.length?flags.join(', '):'(none)'}\n\nFinal upper CUSUM: ${fmtNum(sHigh,4)}\nFinal lower CUSUM: ${fmtNum(sLow,4)}`,
  decoded:`CUSUM accumulates deviations from the target. When the cumulative sum exceeds h, a shift is signalled. It is optimal for detecting small sustained shifts.`
 };
}

/* 26.9 control chart */
function demoControlChart(text){
 const x=parseNums(text);
 if(x.length<5)throw Error('Need at least 5 points.');
 const window=Math.min(10,x.length);
 const base=x.slice(0,window);
 const m=mean(base),sd=stdev(base);
 const ucl=m+3*sd,lcl=m-3*sd;
 const flags=[];
 for(let i=0;i<x.length;i++)if(x[i]>ucl||x[i]<lcl)flags.push(i);
 // Western Electric rule 2: 2 of 3 beyond 2 sigma same side
 const rule2=[];
 for(let i=2;i<x.length;i++){
  let up=0,dn=0;
  for(let j=i-2;j<=i;j++){
   if(x[j]>m+2*sd)up++;
   if(x[j]<m-2*sd)dn++;
  }
  if(up>=2||dn>=2)rule2.push(i);
 }
 return {
  html:linePlotSVG([
   {label:'Data',points:x.map((v,i)=>[i,v]),dots:true,color:'var(--accent)'},
   {label:'Center',points:[[0,m],[x.length-1,m]],color:'var(--subtle)'},
   {label:'UCL',points:[[0,ucl],[x.length-1,ucl]],color:'var(--bad)'},
   {label:'LCL',points:[[0,lcl],[x.length-1,lcl]],color:'var(--bad)'}
  ],{height:240}),
  encoded:`Baseline window: first ${window} points\nCenter = ${fmtNum(m,4)}\nUCL = ${fmtNum(ucl,4)}\nLCL = ${fmtNum(lcl,4)}\n\nRule 1 signals (beyond 3 sigma): ${flags.length?flags.join(', '):'(none)'}\nRule 2 signals (2 of 3 beyond 2 sigma): ${rule2.length?rule2.join(', '):'(none)'}`,
  decoded:`Shewhart chart with 3-sigma limits. Rule 1 catches large shifts. Rule 2 catches smaller sustained shifts. Control limits describe process variation, not specification limits.`
 };
}

/* 26.9 robust outliers */
function demoRobustOutliers(text){
 const x=parseNums(text);
 if(x.length<5)throw Error('Need at least 5 points.');
 const med=median(x);
 const m=mad(x);
 const q1=quantile(x,0.25),q3=quantile(x,0.75),iqr=q3-q1;
 const modz=x.map(v=>0.6745*(v-med)/(m||1));
 const modFlags=[];
 for(let i=0;i<x.length;i++)if(Math.abs(modz[i])>3.5)modFlags.push(i);
 const iqrFlags=[];
 for(let i=0;i<x.length;i++)if(x[i]<q1-1.5*iqr||x[i]>q3+1.5*iqr)iqrFlags.push(i);
 return {
  encoded:`n = ${x.length}\nmedian = ${fmtNum(med,4)}\nMAD = ${fmtNum(m,4)}\nQ1 = ${fmtNum(q1,4)}\nQ3 = ${fmtNum(q3,4)}\nIQR = ${fmtNum(iqr,4)}\n\nModified z-scores:\n  ${modz.map(z=>fmtNum(z,2)).join(', ')}\n\nModified z flags (|z| > 3.5): ${modFlags.length?modFlags.map(i=>`${i}(${x[i]})`).join(', '):'(none)'}\nIQR flags: ${iqrFlags.length?iqrFlags.map(i=>`${i}(${x[i]})`).join(', '):'(none)'}`,
  decoded:`The modified z-score uses median and MAD instead of mean and sd. The 0.6745 factor makes it comparable to the standard z-score for Normal data.`
 };
}

/* 26.10 A/B test */
function demoAbTest(text){
 const lines=text.trim().split(/\n/).filter(Boolean);
 if(lines.length<2)throw Error('Enter: n_a c_a on the first line, n_b c_b on the second.');
 const a=lines[0].split(/[\s,]+/).filter(Boolean).map(Number);
 const b=lines[1].split(/[\s,]+/).filter(Boolean).map(Number);
 const [nA,cA]=a,[nB,cB]=b;
 const pA=cA/nA,pB=cB/nB;
 const pPool=(cA+cB)/(nA+nB);
 const se=Math.sqrt(pPool*(1-pPool)*(1/nA+1/nB));
 const z=(pA-pB)/se;
 const p=2*(1-normalCDF(Math.abs(z)));
 const diff=pA-pB;
 const ci=[diff-1.96*se,diff+1.96*se];
 const relLift=diff/pB;
 // Sample size needed for future test at current observed effect
 const zAlpha=1.96,zBeta=0.84;
 const reqN=Math.ceil(Math.pow(zAlpha+zBeta,2)*(pA*(1-pA)+pB*(1-pB))/(diff*diff||1e-9));
 return {
  encoded:`Variant A: n=${nA}, conversions=${cA}, rate=${fmtNum(pA,4)}\nVariant B: n=${nB}, conversions=${cB}, rate=${fmtNum(pB,4)}\n\nDifference (A - B): ${fmtNum(diff,4)}\nRelative lift: ${fmtNum(relLift*100,2)}%\n\nPooled rate: ${fmtNum(pPool,4)}\nSE: ${fmtNum(se,6)}\nz = ${fmtNum(z,4)}\np = ${fmtNum(p,6)}\n\n95% CI for difference: [${fmtNum(ci[0],4)}, ${fmtNum(ci[1],4)}]\n\n${p<0.05?'Significant at alpha = 0.05':'Not significant at alpha = 0.05'}\nSample size needed per arm for this effect (80% power): ${fmtNum(reqN,0)}`,
  decoded:`The two-proportion z-test compares conversion rates. The p-value is the probability of a difference at least this extreme under the null. The CI gives the plausible range for the effect.`
 };
}

/* 26.10 power and bandits */
function demoPowerBandit(text){
 const lines=text.trim().split(/\n/).filter(Boolean);
 if(!lines.length)throw Error('Enter: p_a p_b alpha, then bandit arm means on following lines.');
 // Power analysis line
 const head=lines[0].split(/[\s,]+/).filter(Boolean).map(Number);
 const pA=head[0]||0.10,pB=head[1]||0.12,alpha=head[2]||0.05;
 const zAlpha=normalInv(1-alpha/2);
 const zBeta=normalInv(0.8);
 const delta=Math.abs(pA-pB);
 const var_=pA*(1-pA)+pB*(1-pB);
 const reqN=Math.ceil(Math.pow(zAlpha+zBeta,2)*var_/(delta*delta||1e-9));
 // Bandit arms
 const arms=lines.slice(1).map(l=>l.split(/[\s,]+/).filter(Boolean).map(Number));
 let banditOut='';
 let banditPlot=[];
 if(arms.length>=2){
  const rand=rngFactory(42);
  const alphas=arms.map(()=>1),betas=arms.map(()=>1);
  const counts=arms.map(()=>0);
  const trials=5000;
  for(let t=0;t<trials;t++){
   const samples=alphas.map((a,i)=>betaSample(a,betas[i],rand));
   let best=0;
   for(let i=1;i<arms.length;i++)if(samples[i]>samples[best])best=i;
   counts[best]++;
   const mean_i=arms[best][0];
   const r=rand()<mean_i?1:0;
   alphas[best]+=r;
   betas[best]+=1-r;
  }
  banditOut=`Thompson sampling (${trials} trials):\n${arms.map((a,i)=>`  Arm ${i+1} (true mean ${a[0]}): ${counts[i]} pulls (${(counts[i]/trials*100).toFixed(1)}%)`).join('\n')}`;
  banditPlot=arms.map((a,i)=>({label:`Arm ${i+1}`,points:[[i,counts[i]/trials]]}));
 }
 return {
  encoded:`Power analysis:\n  p_A = ${pA}, p_B = ${pB}, alpha = ${alpha}\n  Required n per arm for 80% power: ${reqN}\n\n${banditOut}`,
  decoded:`Power analysis gives the sample size needed to detect an effect. Thompson sampling allocates more traffic to better arms by sampling from the posterior of each arm's mean.`
 };
}
function betaSample(a,b,rand){
 // Marsaglia-Tsang method for Beta
 const x=gammaSample(a,rand);
 const y=gammaSample(b,rand);
 return x/(x+y);
}
function gammaSample(shape,rand){
 if(shape<1)return gammaSample(shape+1,rand)*Math.pow(rand(),1/shape);
 const d=shape-1/3;
 const c=1/Math.sqrt(9*d);
 while(true){
  let x,v;
  do{x=normalSample(rand);v=1+c*x}while(v<=0);
  v=v*v*v;
  const u=rand();
  if(u<1-0.0331*x*x*x*x)return d*v;
  if(Math.log(u)<0.5*x*x+d*(1-v+Math.log(v)))return d*v;
 }
}
function normalSample(rand){
 const u1=rand()+1e-12,u2=rand();
 return Math.sqrt(-2*Math.log(u1))*Math.cos(2*Math.PI*u2);
}

/* 26.10 KDE and LOESS */
function demoKdeLoess(text){
 const x=parseNums(text);
 if(x.length<4)throw Error('Need at least 4 points.');
 const n=x.length;
 const m=mean(x),sd=stdev(x);
 const h=1.06*sd*Math.pow(n,-0.2);
 const lo=Math.min(...x)-sd,hi=Math.max(...x)+sd;
 const xs=linspace(lo,hi,120);
 const kde=xs.map(xi=>{
  let s=0;
  for(const v of x)s+=Math.exp(-0.5*Math.pow((xi-v)/h,2))/(h*Math.sqrt(2*Math.PI));
  return [xi,s/n];
 });
 return {
  html:linePlotSVG([{label:'KDE',points:kde}],{height:240}),
  encoded:`n = ${n}\nmean = ${fmtNum(m,4)}\nsd = ${fmtNum(sd,4)}\nSilverman bandwidth h = ${fmtNum(h,4)}\n\nKDE peaks near the data density.`,
  decoded:`Kernel density estimation places a Gaussian kernel at each data point and sums them. The bandwidth h controls smoothness. Silverman's rule gives a reasonable default.`
 };
}

/* 26.10 Kalman */
function demoKalman(text){
 const obs=parseNums(text);
 if(obs.length<4)throw Error('Need at least 4 points.');
 const processVar=1,obsVar=1;
 let x=obs[0],p=1;
 const filtered=[];
 const gains=[];
 for(const y of obs){
  const pPred=p+processVar;
  const k=pPred/(pPred+obsVar);
  gains.push(k);
  x=x+k*(y-x);
  p=(1-k)*pPred;
  filtered.push(x);
 }
 return {
  html:linePlotSVG([
   {label:'Observations',points:obs.map((v,i)=>[i,v]),dots:true,color:'var(--accent)'},
   {label:'Kalman filter',points:filtered.map((v,i)=>[i,v]),color:'var(--good)'}
  ],{height:240}),
  encoded:`n = ${obs.length}\nQ = ${processVar}, R = ${obsVar}\n\nKalman gains:\n  ${gains.map(g=>fmtNum(g,3)).join(', ')}\n\nFinal filtered value: ${fmtNum(filtered[filtered.length-1],4)}`,
  decoded:`The Kalman filter predicts the next state, then corrects with the observation. The gain K is the weight on the observation. Larger R means noisier observations, so the filter relies more on the model.`
 };
}

<section class="panel"><div class="panel-head"><h2>1. Understand the idea</h2><p>Plain language and a mental picture</p></div><div class="body idea"><div><p>${esc(l.summary)}</p><p><strong>What problem it solves:</strong> ${esc(l.problem)}</p><div class="takeaway"><strong>Takeaway:</strong> ${esc(l.output)}</div></div><aside class="mental"><small>Mental picture</small><strong>${esc(l.mental)}</strong><p>${esc(l.mentalText)}</p></aside></div></section>

<section class="panel"><div class="panel-head"><h2>3. How it works</h2><p>Step by step, with the key rule that makes it correct</p></div><div class="body two"><div>${listToHTML(l.steps)}<div class="takeaway" style="margin-top:14px"><strong>Key rule:</strong> ${esc(l.invariant)}</div></div><pre class="pseudo">${esc(l.pseudo)}</pre></div><div class="table-wrap" style="margin-top:16px"><table><thead><tr><th>Step</th><th>What happens</th><th>Why it matters</th></tr></thead><tbody>${l.trace.map(r=>`<tr>${r.map(v=>`<td>${esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></section>
${demoArea}

<section class="panel"><div class="panel-head"><h2>5. Code and usage</h2><p>Reference code is for learning. Real code should use a vetted library.</p></div><div class="code-head"><div><span class="tag">${codeRecord(l)?'Python example':'Concept outline, not executable'}</span> <span class="tag">Editable</span></div><div class="header-actions" style="margin:0"><button class="btn" id="copyCode">Copy code</button><button class="btn" id="downloadCode">Download</button></div></div><textarea id="codeEditor" class="code-editor" spellcheck="false" aria-label="Editable Python code">${esc(code)}</textarea><div class="code-foot"><span>${codeRecord(l)?'Reference example. The in-page lab runs its own JavaScript implementation.':'Lesson-specific outline, not an implementation.'}</span><span id="codeStatus">Local draft</span></div><div class="body"><div class="mini"><h3>Where it is used</h3><p>${esc(l.uses)}</p></div><div class="notice" style="margin-top:12px"><strong>Common pitfall:</strong> ${esc(l.pitfall)}</div></div></section>

<section class="panel"><div class="panel-head"><h2>8. References</h2><p>Standard references for this topic</p></div><div class="body">${references}<p class="muted" style="font-size:11.5px;margin-top:14px">The labs on this page are teaching implementations. For production work use NumPy, SciPy, statsmodels, scikit-learn, PyMC, Stan, Prophet, or another vetted library.</p></div></section>
<footer class="footer"><span>Az Statistics, Probability &amp; Time Series Lab · local learning</span><span>Lesson ${index+1} of ${LESSONS.length} · Next: ${esc(next.title)}</span><button class="btn" id="nextLesson">Next →</button></footer>`;

 $('#bookmarkBtn').onclick=()=>{state.bookmarks.has(id)?state.bookmarks.delete(id):state.bookmarks.add(id);save();renderLesson(id);toast(state.bookmarks.has(id)?'Bookmarked':'Bookmark removed')};
 $('#completeBtn').onclick=()=>{state.completed.has(id)?state.completed.delete(id):state.completed.add(id);save();renderTree();renderLesson(id);toast(state.completed.has(id)?'Lesson completed':'Completion removed')};
 $('#nextLesson').onclick=()=>openLesson(next.id);
 $('#copyCode').onclick=async()=>{const v=$('#codeEditor').value;try{await navigator.clipboard.writeText(v);toast('Code copied')}catch{const ta=$('#codeEditor');ta.select();document.execCommand('copy');toast('Code copied')}};
 $('#downloadCode').onclick=()=>{const r=codeRecord(l);downloadText(`${id}.${r?'py':'txt'}`,$('#codeEditor').value,r?'text/x-python':'text/plain')};
 $('#codeEditor').addEventListener('input',()=>{state.drafts[id]=$('#codeEditor').value;save();$('#codeStatus').textContent='Draft saved locally'});
 if(hasDemo){
  $('#runLab').onclick=()=>runLab(l);
  $('#resetSample').onclick=()=>{$('#labInput').value=l.sample||'';$('#labEncoded').textContent='Run the lab to see output.';$('#labDecoded').textContent='Step notes appear here.'};
  runLab(l,true);
 }
 renderTree();save();
 if(location.hash!==`#${id}`)history.replaceState(null,'',`#${id}`);

function renderHome(){
 state.page='home';
 $('#mainView').innerHTML=`<div class="home-hero"><div class="eyebrow">AZ · STATISTICS AND FORECASTING TOOLBOOK</div><h1>Understand statistics, probability and time series from distributions to ARIMA and Kalman filters.</h1><p>A single-file course covering probability foundations, descriptive statistics and resampling, hypothesis testing, Bayesian methods, regression and GLMs, survival analysis, time-series foundations, forecasting models, change and anomaly detection, and experiments with density estimation. Every lesson has a plain explanation and most have a runnable lab.</p><div class="header-actions" style="margin:0"><button class="btn primary" id="startFirst">Start at the beginning</button><button class="btn" id="resumeLesson">Continue lesson</button></div></div>
<div class="stats"><div class="stat"><strong>${CHAPTERS.length}</strong><span>chapters</span></div><div class="stat"><strong>${LESSONS.length}</strong><span>lessons</span></div><div class="stat"><strong>${LESSONS.filter(l=>l.demo&&l.demo!=='none').length}</strong><span>runnable labs</span></div><div class="stat"><strong>1</strong><span>standalone HTML file</span></div></div>
<section class="panel"><div class="panel-head"><h2>Honest scope</h2><p>One app covers the whole curriculum. Production statistical software is a separate engineering project.</p></div><div class="body two"><div class="mini"><h3>What runs here</h3><p>Normal/binomial/Poisson distributions, expectation and variance, Bayes' theorem, robust descriptive statistics, bootstrap and permutation tests, Welch t-test, chi-square, multiple-testing corrections (Bonferroni, Holm, BH), Beta-Binomial and Normal-Normal posteriors, Metropolis MCMC, OLS, logistic regression, ridge regression, Kaplan-Meier, competing-risks CIF, ACF/PACF, decomposition, SES/Holt, Holt-Winters, AR(1), ARIMA, Kalman filter, EWMA z-scores, CUSUM, Shewhart control charts, robust outliers, two-proportion A/B test, power analysis, Thompson sampling, KDE and Kalman smoothing.</p></div><div class="mini"><h3>What does not run here</h3><p>Full Bayesian MCMC (Stan, PyMC), variational inference, Cox proportional hazards, full SARIMA and auto-ARIMA, PELT change detection, LOESS, isolation forests, sequential tests with alpha-spending, and industrial-scale time-series pipelines. For real work use NumPy, SciPy, statsmodels, scikit-learn, PyMC, Stan, Prophet, or another vetted library.</p></div></div></section>
<div class="panel"><div class="panel-head"><h2>Course map</h2><p>Pick a chapter. The path runs from probability foundations to experiments and density estimation.</p></div><div class="body"><div class="chapter-cards">${CHAPTERS.map((c,i)=>`<button class="chapter-card" data-chapter="${c.id}"><span class="num">CHAPTER ${String(i+1).padStart(2,'0')} · ${c.ids.length} LESSONS</span><strong>${esc(c.title.replace(/^\d+(\.\d+)?\s*/,''))}</strong><p>${esc(c.desc)}</p></button>`).join('')}</div></div></div>
<footer class="footer"><span>Az Statistics, Probability &amp; Time Series Lab</span><span>Single file · no external runtime dependencies</span></footer>`;
 $('#startFirst').onclick=()=>openLesson('distributions');
 $('#resumeLesson').onclick=()=>openLesson(state.current&&byId[state.current]?state.current:'distributions');
 $('#mainView').querySelectorAll('[data-chapter]').forEach(b=>b.onclick=()=>{const c=CHAPTERS.find(x=>x.id===b.dataset.chapter);if(c)openLesson(c.ids[0])});
}

function renderProgressPage(){
 state.page='progress';
 $('#mainView').innerHTML=`<div class="breadcrumb">Statistics Lab / Bookmarks & progress</div><header class="header"><div class="eyebrow">LOCAL ONLY</div><h1>Bookmarks and progress</h1><p>Your progress stays in this browser. Export the JSON to move it or keep a backup.</p></header>
<section class="panel"><div class="panel-head"><h2>Completed lessons</h2></div><div class="body">${state.completed.size?`<div class="references">${[...state.completed].map(id=>`<a href="#${id}" data-open="${id}">${esc(byId[id].title)}</a>`).join('')}</div>`:'<p class="muted">No lessons marked complete yet.</p>'}</div></section>
<section class="panel"><div class="panel-head"><h2>Bookmarks</h2></div><div class="body">${state.bookmarks.size?`<div class="references">${[...state.bookmarks].map(id=>`<a href="#${id}" data-open="${id}">${esc(byId[id].title)}</a>`).join('')}</div>`:'<p class="muted">No bookmarks yet.</p>'}</div></section>
<section class="panel"><div class="panel-head"><h2>Progress data</h2></div><div class="body"><div class="header-actions" style="margin:0"><button class="btn primary" id="exportProgress">Export progress JSON</button><button class="btn" id="clearProgress">Clear completion marks</button></div><p class="muted" style="font-size:12.5px;margin-top:14px">Import accepts only known lesson IDs and a supported schema version.</p></div></section>`;
 $('#mainView').querySelectorAll('[data-open]').forEach(a=>a.onclick=e=>{e.preventDefault();openLesson(a.dataset.open)});
 $('#exportProgress').onclick=exportProgress;
 $('#clearProgress').onclick=()=>{if(confirm('Clear all completion marks?')){state.completed.clear();save();renderProgressPage();renderTree();toast('Completion marks cleared')}};
}

function openLesson(id){if(!byId[id])return;renderLesson(id);renderTree();$('#mainView').focus({preventScroll:true});window.scrollTo(0,0)}
function downloadText(name,text,type='text/plain'){const blob=new Blob([text],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),800)}
function exportProgress(){downloadText('az-stats-prob-ts-lab-progress.json',JSON.stringify({schemaVersion:1,completed:[...state.completed],bookmarks:[...state.bookmarks],theme:state.theme,current:state.current,drafts:state.drafts},null,2),'application/json');toast('Progress exported')}
function importProgressFile(file){
 if(file.size>2_000_000){toast('Import rejected: file too large');return}
 const r=new FileReader();
 r.onload=()=>{try{
  const d=JSON.parse(r.result);
  if(!d||d.schemaVersion!==1||!Array.isArray(d.completed)||!Array.isArray(d.bookmarks)||typeof d.drafts!=='object')throw Error('bad schema');
  if([...d.completed,...d.bookmarks].some(id=>typeof id!=='string'||!byId[id]))throw Error('unknown id');
  state.completed=new Set(d.completed);
  state.bookmarks=new Set(d.bookmarks);
  state.theme=['system','light','dark'].includes(d.theme)?d.theme:'system';
  state.current=byId[d.current]?d.current:null;
  state.drafts=Object.fromEntries(Object.entries(d.drafts).filter(([k,v])=>byId[k]&&typeof v==='string'&&v.length<100000));
  applyTheme();save();renderTree();
  state.current?openLesson(state.current):renderHome();
  toast('Progress imported');
 }catch(e){toast('Import rejected: invalid progress data')}};
 r.readAsText(file);
}

function bindGlobal(){
 $('#themeSelect').onchange=()=>{state.theme=$('#themeSelect').value;applyTheme();save()};
 $('#printBtn').onclick=()=>print();
 $('#exportBtn').onclick=exportProgress;
 $('#importBtn').onclick=()=>$('#importFile').click();
 $('#importFile').onchange=e=>{if(e.target.files[0])importProgressFile(e.target.files[0]);e.target.value=''};
 $('#searchInput').oninput=renderTree;
 $('#chapterFilter').onchange=renderTree;
 $('#homeLink').onclick=e=>{e.preventDefault();renderHome();history.replaceState(null,'','#home')};
 $('#courseTree').onclick=e=>{const b=e.target.closest('[data-lesson]');if(b)openLesson(b.dataset.lesson)};
 document.querySelectorAll('[data-page="home"]').forEach(b=>b.onclick=renderHome);
 document.querySelectorAll('[data-page="progress"]').forEach(b=>b.onclick=renderProgressPage);
 document.addEventListener('keydown',e=>{
  if(e.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){e.preventDefault();$('#searchInput').focus()}
  if(e.key.toLowerCase()==='t'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){
   state.theme=state.theme==='dark'?'light':state.theme==='light'?'system':'dark';
   applyTheme();save();
  }
 });
}

function init(){
 load();
 applyTheme();
 CHAPTERS.forEach(c=>{const op=document.createElement('option');op.value=c.id;op.textContent=c.title;$('#chapterFilter').append(op)});
 bindGlobal();
 renderTree();
 const hash=location.hash.replace(/^#/,'');
 if(hash&&byId[hash])renderLesson(hash);
 else if(state.current&&byId[state.current])renderLesson(state.current);
 else renderHome();
 progress();
}
init();
</script></body></html>
